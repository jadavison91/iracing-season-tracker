                                        style: {
                                          color: '#f85149',
                                          fontFamily: 'monospace',
                                          fontSize: '11px',
                                        },
                                      },
                                      '+' + diffSec + 's'
                                    )
                                  : null
                              ),
                              div(
                                {
                                  style: {
                                    display: 'flex',
                                    gap: '10px',
                                    color: '#8b949e',
                                    fontSize: '11px',
                                  },
                                },
                                span({}, 'P' + l.pos),
                                span({}, l.date.slice(0, 10))
                              )
                            );
                          })
                        )
                      : null
                  );
                });

              return div(
                { class: 'card', style: { padding: '0', overflow: 'hidden' } },
                // ── Track header row ──
                div(
                  {
                    style: {
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center',
                      padding: '12px 16px',
                      cursor: 'pointer',
                    },
                    onClick: () => {
                      state.bzTrackExp[tk.track] = !tExp;
                      render();
                    },
                  },
                  div(
                    { style: { display: 'flex', flexDirection: 'column', gap: '3px' } },
                    div(
                      { style: { fontSize: '14px', fontWeight: '700', color: '#c9d1d9' } },
                      '🏁 ' + tk.track
                    ),
                    div(
                      {
                        style: {
                          display: 'flex',
                          gap: '12px',
                          fontSize: '12px',
                          color: '#8b949e',
                          flexWrap: 'wrap',
                          marginTop: '2px',
                        },
                      },
                      bestLapStr
                        ? span(
                            {},
                            span(
                              {
                                style: {
                                  color: '#e3b341',
                                  fontWeight: '700',
                                  fontFamily: 'monospace',
                                },
                              },
                              bestLapStr
                            ),
                            state.lang === 'de' ? ' Bestzeit' : ' Best lap'
                          )
                        : null,
                      span(
                        {},
                        tk.carCount +
                          ' ' +
                          (state.lang === 'de'
                            ? 'Auto' + (tk.carCount !== 1 ? 's' : '')
                            : 'car' + (tk.carCount !== 1 ? 's' : ''))
                      )
                    )
                  ),
                  div(
                    {
                      style: {
                        color: '#484f58',
                        fontSize: '14px',
                        transition: 'transform .15s',
                        transform: tExp ? 'rotate(180deg)' : 'rotate(0)',
                      },
                    },
                    '▼'
                  )
                ),
                // ── Car list (when track expanded) ──
                tExp
                  ? div(
                      { style: { borderTop: '1px solid #21262d', padding: '10px 12px' } },
                      ...carRows
                    )
                  : null
              );
            }),
            trackRows.length === 0
              ? div(
                  {
                    class: 'card',
                    style: { textAlign: 'center', color: '#8b949e', padding: '40px' },
                  },
                  t('no_bestzeiten')
                )
              : null
          );
        }

        // ════════════════════════════════
        // 5. STREET vs. PERMANENT TRACK
        // ════════════════════════════════
        else if (section === 'street') {
          const STREET_CIRCUITS = [
            'Adelaide Street Circuit',
            'Long Beach Street Circuit',
            'Detroit Grand Prix at Belle Isle',
            'Circuit Gilles Villeneuve',
            'Miami International Autodrome',
            'Circuit des 24 Heures du Mans',
            'Mount Panorama Circuit',
            'St. Petersburg',
          ];
          const isStreet = (track) =>
            STREET_CIRCUITS.some(
              (sc) =>
                track &&
                track.toLowerCase().includes(sc.toLowerCase().split(' ').slice(0, 3).join(' '))
            );

          const streetR = filtRaces.filter((r) => isStreet(r.track));
          const permR = filtRaces.filter((r) => !isStreet(r.track));

          const calcStats = (arr) => {
            if (!arr.length) return null;
            const count = arr.length;
            const avgPos = (arr.reduce((s, r) => s + r.pos, 0) / count).toFixed(1);
            const avgInc = (arr.reduce((s, r) => s + r.inc, 0) / count).toFixed(2);
            const irSum = arr.reduce(
              (s, r) => s + ((r.iRatingAfter || 0) - (r.iRatingBefore || 0)),
              0
            );
            const avgIR = (irSum / count).toFixed(1);
            const cleanPct = Math.round((arr.filter((r) => r.inc === 0).length / count) * 100);
            const best = Math.min(...arr.map((r) => r.pos));
            const wins = arr.filter((r) => r.pos === 1).length;
            return { count, avgPos, avgInc, irSum, avgIR, cleanPct, best, wins };
          };

          const sS = calcStats(streetR);
          const pS = calcStats(permR);

          const statCard = (label, color, emoji, stats, trackList) => {
            if (!stats)
              return div(
                {
                  class: 'card',
                  style: {
                    borderColor: color + '44',
                    textAlign: 'center',
                    color: '#8b949e',
                    padding: '30px',
                  },
                },
                t('no_races_selection')
              );
            const irC = parseFloat(stats.avgIR) >= 0 ? '#3fb950' : '#f85149';
            const incC =
              parseFloat(stats.avgInc) <= 2
                ? '#3fb950'
                : parseFloat(stats.avgInc) <= 4
                  ? '#e3b341'
                  : '#f85149';
            return div(
              { class: 'card', style: { borderColor: color + '44' } },
              div(
                {
                  style: {
                    fontSize: '13px',
                    color,
                    fontWeight: '700',
                    letterSpacing: '1px',
                    marginBottom: '12px',
                  },
                },
                emoji + ' ' + label + ' — ' + stats.count + ' ' + t('races')
              ),
              div(
                {
                  style: {
                    display: 'grid',
                    gridTemplateColumns: 'repeat(3,1fr)',
                    gap: '8px',
                    marginBottom: '12px',
                  },
                },
                ...[
                  ['Ø Finish', '#c9d1d9', stats.avgPos],
                  ['Ø Incidents', incC, stats.avgInc + 'x'],
                  [
                    t('avg_ir_per_race'),
                    irC,
                    (parseFloat(stats.avgIR) >= 0 ? '+' : '') + stats.avgIR,
                  ],
                  ['Sauber', '#3fb950', stats.cleanPct + '%'],
                  ['Best Result', '#ffd700', 'P' + stats.best],
                  [t('wins'), '#e3b341', stats.wins + 'x 🏆'],
                ].map(([l, c, v]) =>
                  div(
                    { style: { background: '#161b22', borderRadius: '8px', padding: '8px 10px' } },
                    div(
                      {
                        style: {
                          fontSize: '10px',
                          color: '#8b949e',
                          marginBottom: '3px',
                          letterSpacing: '1px',
                          fontWeight: '700',
                        },
                      },
                      l
                    ),
                    div(
                      {
                        style: {
                          fontSize: '18px',
                          fontWeight: '900',
                          color: c,
                          fontFamily: 'monospace',
                        },
                      },
                      v
                    )
                  )
                )
              ),
              trackList && trackList.length > 0
                ? (() => {
                    const tCount = {};
                    trackList.forEach((t) => {
                      tCount[t] = (tCount[t] || 0) + 1;
                    });
                    const tracks = Object.entries(tCount).sort((a, b) => b[1] - a[1]);
                    const maxC = tracks[0][1] || 1;
                    const shortT = (t) =>
                      t
                        .replace(' Street Circuit', '')
                        .replace(' Grand Prix at Belle Isle', '')
                        .replace('Circuit des 24 Heures du Mans', 'Le Mans')
                        .replace('Circuit Gilles Villeneuve', 'Gilles Villeneuve')
                        .replace('Miami International Autodrome', 'Miami')
                        .replace('WeatherTech Raceway at Laguna Seca', 'Laguna Seca')
                        .replace(' International Raceway', '')
                        .replace(' International Speedway', '')
                        .replace(' Motorsports Park', '')
                        .replace(' Motor Speedway', '')
                        .replace(' Racing Circuit', '')
                        .replace(' Circuit', '')
                        .replace(' Raceway', '')
                        .replace(' Speedway', '');
                    return div(
                      {
                        style: {
                          borderTop: '1px solid #21262d',
                          paddingTop: '12px',
                          marginTop: '4px',
                        },
                      },
                      div(
                        {
                          style: {
                            fontSize: '10px',
                            color: '#8b949e',
                            fontWeight: '700',
                            letterSpacing: '1px',
                            marginBottom: '10px',
                          },
                        },
                        t('raced_tracks')
                      ),
                      div(
                        {
                          style: {
                            display: 'flex',
                            flexWrap: 'wrap',
                            gap: '8px 12px',
                            alignItems: 'center',
                            lineHeight: '1.6',
                            padding: '4px 0',
                          },
                        },
                        ...tracks.flatMap(([t, c], i) => {
                          const sep =
                            i > 0
                              ? [
                                  span(
                                    {
                                      style: {
                                        color: '#30363d',
                                        fontSize: '14px',
                                        userSelect: 'none',
                                      },
                                    },
                                    '·'
                                  ),
                                ]
                              : [];
                          return [
                            ...sep,
                            (() => {
                              const ratio = c / maxC;
                              const fs = Math.round(10 + ratio * 14);
                              const op = 0.5 + ratio * 0.5;
                              const fw = ratio > 0.5 ? '900' : '700';
                              return span(
                                {
                                  title:
                                    t + ' (' + c + ' ' + state.lang === 'de'
                                      ? 'Rennen'
                                      : 'races' + ')',
                                  style: {
                                    fontSize: fs + 'px',
                                    fontWeight: fw,
                                    color: color,
                                    opacity: op,
                                    cursor: 'default',
                                    fontFamily: "'Courier New',monospace",
                                  },
                                },
                                shortT(t) + (c > 1 ? ' ×' + c : '')
                              );
                            })(),
                          ];
                        })
                      )
                    );
                  })()
                : null
            );
          };

          const deltaRow = (label, sVal, pVal, higherIsBetter = true) => {
            const s = parseFloat(sVal),
              p = parseFloat(pVal);
            if (isNaN(s) || isNaN(p)) return null;
            const diff = (s - p).toFixed(2);
            const streetBetter = higherIsBetter ? s > p : s < p;
            const streetWorse = higherIsBetter ? s < p : s > p;
            const c = streetBetter ? '#3fb950' : streetWorse ? '#f85149' : '#8b949e';
            const icon = streetBetter ? '▲' : streetWorse ? '▼' : '–';
            return h(
              'tr',
              { style: { borderBottom: '1px solid #21262d44' } },
              h(
                'td',
                {
                  style: {
                    padding: '8px 12px',
                    color: '#8b949e',
                    fontSize: '12px',
                    fontWeight: '700',
                    textTransform: 'uppercase',
                    letterSpacing: '0.5px',
                  },
                },
                label
              ),
              h(
                'td',
                {
                  style: {
                    padding: '8px 12px',
                    color: '#e06c75',
                    fontWeight: '700',
                    fontFamily: 'monospace',
                    textAlign: 'center',
                  },
                },
                sVal
              ),
              h(
                'td',
                {
                  style: {
                    padding: '8px 12px',
                    color: '#61afef',
                    fontWeight: '700',
                    fontFamily: 'monospace',
                    textAlign: 'center',
                  },
                },
                pVal
              ),
              h(
                'td',
                {
                  style: {
                    padding: '8px 12px',
                    color: c,
                    fontWeight: '700',
                    fontFamily: 'monospace',
                    textAlign: 'center',
                  },
                },
                icon + ' ' + (diff > 0 ? '+' : '') + diff
              )
            );
          };

          const streetTracks = [...new Set(streetR.map((r) => r.track))];
          const permCount = [...new Set(permR.map((r) => r.track))].length;

          sectionContent = div(
            { style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
            div(
              {
                style: {
                  background: '#161b22',
                  borderRadius: '8px',
                  padding: '10px 14px',
                  fontSize: '12px',
                  color: '#8b949e',
                  display: 'flex',
                  gap: '16px',
                  flexWrap: 'wrap',
                },
              },
              span(
                {},
                span({ style: { color: '#e06c75', fontWeight: '700' } }, '🏙️ Street Circuits: '),
                streetR.length +
                  ' ' +
                  (state.lang === 'de' ? 'Rennen auf' : 'races on') +
                  ' ' +
                  streetTracks.length +
                  ' ' +
                  (state.lang === 'de' ? 'Strecken' : 'tracks')
              ),
              span(
                {},
                span({ style: { color: '#61afef', fontWeight: '700' } }, '🏁 Permanent Tracks: '),
                permR.length +
                  ' ' +
                  (state.lang === 'de' ? 'Rennen auf' : 'races on') +
                  ' ' +
                  permCount +
                  ' ' +
                  (state.lang === 'de' ? 'Strecken' : 'tracks')
              )
            ),
            sS && pS
              ? div(
                  { class: 'card' },
                  div(
                    {
                      style: {
                        fontSize: '13px',
                        color: '#c9d1d9',
                        fontWeight: '700',
                        marginBottom: '12px',
                        letterSpacing: '1px',
                      },
                    },
                    t('direct_compare')
                  ),
                  div(
                    { style: { overflowX: 'auto' } },
                    h(
                      'table',
                      {
                        style: {
                          width: '100%',
                          borderCollapse: 'collapse',
                          fontFamily: "'Courier New',monospace",
                          fontSize: '13px',
                        },
                      },
                      h(
                        'thead',
                        {},
                        h(
                          'tr',
                          {},
                          ...[
                            'Metrik',
                            span({ style: { color: '#e06c75' } }, t('stat_street')),
                            span({ style: { color: '#61afef' } }, '🏁 Permanent'),
                            'Δ Street',
                          ].map((col) =>
                            h(
                              'th',
                              {
                                style: {
                                  textAlign: 'center',
                                  padding: '8px 12px',
                                  color: '#8b949e',
                                  fontSize: '11px',
                                  letterSpacing: '1px',
                                  fontWeight: '700',
                                  borderBottom: '1px solid #21262d',
                                  textTransform: 'uppercase',
                                },
                              },
                              col
                            )
                          )
                        )
                      ),
                      h(
                        'tbody',
                        {},
                        deltaRow('Ø Finish Pos', sS.avgPos, pS.avgPos, false),
                        deltaRow('Ø Incidents', sS.avgInc, pS.avgInc, false),
                        deltaRow(t('avg_ir_per_race'), sS.avgIR, pS.avgIR, true),
                        deltaRow('Sauber %', sS.cleanPct.toString(), pS.cleanPct.toString(), true)
                      )
                    )
                  ),
                  div(
                    { style: { marginTop: '10px', fontSize: '11px', color: '#8b949e' } },
                    t('street_better')
                  )
                )
              : null,
            div(
              { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' } },
              statCard(
                'Street Circuits',
                '#e06c75',
                '🏙️',
                sS,
                streetR.map((r) => r.track)
              ),
              statCard('Permanent Tracks', '#61afef', '🏁', pS, [...permR.map((r) => r.track)])
            )
          );
        }

        // ════════════════════════════════
        // 6. STRECKENLERNKURVE
        // ════════════════════════════════
        else if (section === 'lernkurve') {
          const lcNormCar = (c) =>
            (c || '')
              .trim()
              .replace('Global Mazda MX-5 Cup', 'MX-5')
              .replace('Global MX-5 Cup', 'MX-5')
              .replace('FIA Formula 4', 'FIA F4');
          const lcToSec = (s) => {
            if (!s) return null;
            const p = s.split(':');
            if (p.length === 2) return parseFloat(p[0]) * 60 + parseFloat(p[1]);
            return parseFloat(s) || null;
          };
          const getWeek = (d) => {
            const dt = new Date(d);
            const jan = new Date(dt.getFullYear(), 0, 1);
            return Math.ceil(((dt - jan) / 864e5 + jan.getDay() + 1) / 7);
          };
          const getYearWeek = (d) => {
            const dt = new Date(d);
            return dt.getFullYear() * 100 + getWeek(d);
          };

          const lcMap = {};
          filtRaces
            .filter((r) => !r.wetRace)
            .forEach((r) => {
              const key = r.track + '|' + lcNormCar(r.car);
              if (!lcMap[key]) lcMap[key] = { track: r.track, car: lcNormCar(r.car), races: [] };
              lcMap[key].races.push(r);
            });

          // Group each track's races into calendar weeks → one data point per week
          const lcTracks = Object.values(lcMap)
            .map((tk) => {
              const byWeek = {};
              tk.races.forEach((r) => {
                const wk = getYearWeek(r.date);
                if (!byWeek[wk]) byWeek[wk] = { week: wk, races: [], label: r.date.slice(0, 10) };
                byWeek[wk].races.push(r);
              });
              const weeks = Object.values(byWeek)
                .sort((a, b) => a.week - b.week)
                .map((w) => {
                  const lapSecs = w.races.map((r) => lcToSec(r.fastestLap)).filter(Boolean);
                  const bestLap = lapSecs.length ? Math.min(...lapSecs) : null;
                  const bestLapStr = lapSecs.length
                    ? w.races.filter((r) => lcToSec(r.fastestLap) === bestLap)[0]?.fastestLap
                    : null;
                  const bestPos = Math.min(...w.races.map((r) => r.pos));
                  const avgSof = w.races.reduce((s, r) => s + (r.sof || 0), 0) / w.races.length;
                  return {
                    label: w.label,
                    count: w.races.length,
                    bestLap,
                    bestLapStr,
                    bestPos,
                    avgSof: Math.round(avgSof),
                  };
                });
              return { ...tk, weeks };
            })
            .filter((t) => t.weeks.reduce((s, w) => s + w.count, 0) >= 2)
            .sort((a, b) =>
              b.weeks.length === a.weeks.length
                ? b.weeks.reduce((s, w) => s + w.count, 0) -
                  a.weeks.reduce((s, w) => s + w.count, 0)
                : b.weeks.length - a.weeks.length
            );

          const singleWeekTracks = lcTracks.filter((t) => t.weeks.length < 2);
          const multiWeekTracks = lcTracks.filter((t) => t.weeks.length >= 2);

          if (!lcTracks.length) {
            sectionContent = div(
              { class: 'card', style: { textAlign: 'center', color: '#8b949e', padding: '40px' } },
              t('min_2_races')
            );
          } else {
            sectionContent = div(
              { style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
              ...multiWeekTracks.map((tk) => {
                const w = tk.weeks;
                const lapWeeks = w.filter((x) => x.bestLap);
                const hasLaps = lapWeeks.length >= 2;

                // ── Trend classification ──
                let trendColor = '#8b949e',
                  trendLabel = '',
                  summaryLine = '';
                if (w.length < 2) {
                  trendLabel = t('one_week_only');
                  summaryLine = t('come_back');
                } else if (hasLaps) {
                  const first = lapWeeks[0].bestLap,
                    last = lapWeeks[lapWeeks.length - 1].bestLap,
                    best = Math.min(...lapWeeks.map((x) => x.bestLap));
                  const imp = first - last;
                  const pct = (imp / first) * 100;
                  // regression
                  const n = lapWeeks.length,
                    xs = lapWeeks.map((_, i) => i),
                    ys = lapWeeks.map((x) => x.bestLap);
                  const sx = xs.reduce((a, b) => a + b, 0),
                    sy = ys.reduce((a, b) => a + b, 0);
                  const sxy = xs.reduce((s, x, i) => s + x * ys[i], 0),
                    sx2 = xs.reduce((s, x) => s + x * x, 0);
                  const slope = n > 1 ? (n * sxy - sx * sy) / (n * sx2 - sx * sx) : 0;
                  if (slope < -0.3) {
                    trendColor = '#3fb950';
                    trendLabel = t('learning_active');
                  } else if (slope < 0.1) {
                    trendColor = '#e3b341';
                    trendLabel = t('plateau');
                  } else {
                    trendColor = '#f85149';
                    trendLabel = t('regression');
                  }
                  summaryLine =
                    state.lang === 'de'
                      ? imp > 0
                        ? 'Bestzeit von ' +
                          lapWeeks[0].bestLapStr +
                          ' auf ' +
                          lapWeeks[lapWeeks.length - 1].bestLapStr +
                          ' (' +
                          Math.abs(imp).toFixed(3) +
                          's schneller)'
                        : 'Bestzeit von ' +
                          lapWeeks[0].bestLapStr +
                          ' auf ' +
                          lapWeeks[lapWeeks.length - 1].bestLapStr +
                          ' (+' +
                          Math.abs(imp).toFixed(3) +
                          's langsamer)'
                      : imp > 0
                        ? 'Best lap improved from ' +
                          lapWeeks[0].bestLapStr +
                          ' to ' +
                          lapWeeks[lapWeeks.length - 1].bestLapStr +
                          ' (' +
                          Math.abs(imp).toFixed(3) +
                          's faster)'
                        : 'Best lap from ' +
                          lapWeeks[0].bestLapStr +
                          ' to ' +
                          lapWeeks[lapWeeks.length - 1].bestLapStr +
                          ' (' +
                          Math.abs(imp).toFixed(3) +
                          's slower)';
                } else {
                  // SoF-adjusted
                  const sofW = w.filter((x) => x.avgSof > 0);
                  if (sofW.length >= 2) {
                    const scores = sofW.map((x) => x.bestPos / (x.avgSof / 1000));
                    const imp = scores[0] - scores[scores.length - 1];
                    if (imp > 0.3) {
                      trendColor = '#3fb950';
                      trendLabel = '📈 Verbesserung (SoF-adj.)';
                    } else if (imp > -0.3) {
                      trendColor = '#e3b341';
                      trendLabel = '→ Plateau (SoF-adj.)';
                    } else {
                      trendColor = '#f85149';
                      trendLabel = '📉 Verschlechterung (SoF-adj.)';
                    }
                    summaryLine = t('no_lap_data');
                  } else {
                    trendLabel = 'Zu wenig Daten';
                    summaryLine = '';
                  }
                }

                // ── Chart (lap times per week) ──
                let chartEl = null;
                if (hasLaps) {
                  const W2 = 560,
                    H2 = 72,
                    pdL = 8,
                    pdR = 8,
                    pdT = 14,
                    pdB = 8;
                  const maxS = Math.max(...lapWeeks.map((x) => x.bestLap));
                  const minS = Math.min(...lapWeeks.map((x) => x.bestLap));
                  const range = maxS - minS || 0.5;
                  const xSt = lapWeeks.length > 1 ? (W2 - pdL - pdR) / (lapWeeks.length - 1) : 0;
                  const yS = (s) => pdT + ((s - minS) / range) * (H2 - pdT - pdB);
                  const pts = lapWeeks.map((x, i) => `${pdL + i * xSt},${yS(x.bestLap)}`).join(' ');
                  const bestSec = Math.min(...lapWeeks.map((x) => x.bestLap));
                  chartEl = h(
                    'svg',
                    {
                      width: '100%',
                      height: String(H2),
                      viewBox: '0 0 ' + W2 + ' ' + H2,
                      style: { display: 'block', marginBottom: '6px' },
                    },
                    h('polyline', {
                      points: pts,
                      fill: 'none',
                      stroke: '#e3b341',
                      strokeWidth: '2',
                      strokeLinejoin: 'round',
                    }),
                    ...lapWeeks.map((x, i) => {
                      const isB = x.bestLap === bestSec;
                      const cx = String(pdL + i * xSt),
                        cy = String(yS(x.bestLap));
                      return h(
                        'g',
                        {},
                        h('circle', {
                          cx,
                          cy,
                          r: isB ? '5' : '4',
                          fill: isB ? '#ffd700' : '#58a6ff',
                          stroke: '#0d1117',
                          strokeWidth: '2',
                        }),
                        h(
                          'text',
                          {
                            x: cx,
                            y: '11',
                            textAnchor: 'middle',
                            fill: '#484f58',
                            fontSize: '9',
                            fontFamily: 'monospace',
                          },
                          x.label.slice(5)
                        )
                      );
                    })
                  );
                }

                return div(
                  { class: 'card' },
                  div(
                    {
                      style: {
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'flex-start',
                        marginBottom: '10px',
                      },
                    },
                    div(
                      {},
                      div(
                        { style: { fontSize: '14px', fontWeight: '700', color: '#c9d1d9' } },
                        tk.track
                      ),
                      div(
                        { style: { fontSize: '11px', color: '#8b949e', marginTop: '2px' } },
                        tk.car +
                          ' · ' +
                          w.length +
                          (state.lang === 'de' ? ' Wochen · ' : ' weeks · ') +
                          w.reduce((s, x) => s + x.count, 0) +
                          ' ' +
                          t('races')
                      )
                    ),
                    div(
                      { style: { textAlign: 'right' } },
                      div(
                        { style: { fontSize: '12px', fontWeight: '700', color: trendColor } },
                        trendLabel
                      ),
                      summaryLine
                        ? div(
                            {
                              style: {
                                fontSize: '11px',
                                color: '#8b949e',
                                marginTop: '2px',
                                maxWidth: '320px',
                                textAlign: 'right',
                              },
                            },
                            summaryLine
                          )
                        : null
                    )
                  ),
                  chartEl,
                  div(
                    { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } },
                    ...w.map((x, i) => {
                      const isB =
                        hasLaps &&
                        x.bestLap &&
                        x.bestLap === Math.min(...lapWeeks.map((y) => y.bestLap));
                      return div(
                        {
                          style: {
                            background: isB ? '#e3b34122' : '#161b22',
                            border: '1px solid ' + (isB ? '#e3b34144' : '#21262d'),
                            borderRadius: '6px',
                            padding: '6px 10px',
                            minWidth: '58px',
                            textAlign: 'center',
                          },
                        },
                        div(
                          { style: { fontSize: '9px', color: '#484f58', marginBottom: '2px' } },
                          'W' + (i + 1) + ' · ' + x.label.slice(5)
                        ),
                        div(
                          {
                            style: {
                              fontSize: '13px',
                              fontWeight: '700',
                              color:
                                x.bestPos <= 3
                                  ? '#ffd700'
                                  : x.bestPos <= 5
                                    ? '#3fb950'
                                    : x.bestPos <= 10
                                      ? '#e3b341'
                                      : '#f85149',
                            },
                          },
                          'P' + x.bestPos
                        ),
                        x.bestLapStr
                          ? div(
                              {
                                style: {
                                  fontSize: '10px',
                                  color: isB ? '#e3b341' : '#8b949e',
                                  fontFamily: 'monospace',
                                  marginTop: '1px',
                                },
                              },
                              x.bestLapStr
                            )
                          : null,
                        x.count > 1
                          ? div(
                              { style: { fontSize: '9px', color: '#484f58', marginTop: '1px' } },
                              x.count + 'x'
                            )
                          : null
                      );
                    })
                  )
                );
              }),
              singleWeekTracks.length > 0
                ? div(
                    {
                      style: {
                        background: '#161b22',
                        border: '1px solid #30363d',
                        borderRadius: '8px',
                        padding: '12px 16px',
                        marginTop: '4px',
                      },
                    },
                    div(
                      {
                        style: {
                          fontSize: '11px',
                          color: '#8b949e',
                          fontWeight: '700',
                          letterSpacing: '1px',
                          marginBottom: '8px',
                        },
                      },
                      t('not_enough_weeks')
                    ),
                    div(
                      { style: { display: 'flex', flexWrap: 'wrap', gap: '6px' } },
                      ...singleWeekTracks.map((tk) =>
                        span(
                          {
                            style: {
                              fontSize: '12px',
                              color: '#484f58',
                              background: '#0d1117',
                              borderRadius: '6px',
                              padding: '4px 10px',
                              fontFamily: "'Courier New',monospace",
                            },
                          },
                          tk.track + ' · ' + tk.weeks[0].count + 'x'
                        )
                      )
                    )
                  )
                : null
            );
          }
        }

        // ════════════════════════════════
        // 7. META-ANALYSE
        // ════════════════════════════════

        // ════════════════════════════════
        // SEASON-AUSWERTUNG
        // ════════════════════════════════
        else if (section === 'season') {
          // ── nutzt globalen filtRaces (Road/Formula/Alle oben rechts) ──
          var seasonRaces = filtRaces;

          // ── iR mini-chart helper ──
          var mkChart = function (pts, W, H) {
            if (!pts || pts.length < 2) return null;
            var P = 6,
              mn = Math.min.apply(null, pts),
              mx = Math.max.apply(null, pts);
            var rng = Math.max(mx - mn, 80);
            var xp = pts.map(function (v, i) {
              return P + (i / (pts.length - 1)) * (W - 2 * P);
            });
            var yp = pts.map(function (v) {
              return H - P - ((v - mn) / rng) * (H - 2 * P);
            });
            var poly = xp
              .map(function (x, i) {
                return x.toFixed(1) + ',' + yp[i].toFixed(1);
              })
              .join(' ');
            var lc = pts[pts.length - 1] >= pts[0] ? '#3fb950' : '#f85149';
            return h(
              'svg',
              {
                width: '100%',
                height: String(H),
                viewBox: '0 0 ' + W + ' ' + H,
                style: { display: 'block' },
              },
              h('polygon', {
                points:
                  xp[0].toFixed(1) +
                  ',' +
                  H +
                  ' ' +
                  poly +
                  ' ' +
                  xp[xp.length - 1].toFixed(1) +
                  ',' +
                  H,
                fill: lc + '18',
              }),
              h('polyline', {
                points: poly,
                fill: 'none',
                stroke: lc,
                strokeWidth: '1.8',
                strokeLinejoin: 'round',
              })
            );
          };

          // ── group by season ──
          var seasonMap = {};
          seasonRaces.forEach(function (r) {
            if (!r.seasonYear || !r.seasonQuarter) return;
            var key = r.seasonYear + 'S' + r.seasonQuarter;
            if (!seasonMap[key])
              seasonMap[key] = {
                key: key,
                year: r.seasonYear,
                quarter: r.seasonQuarter,
                races: [],
              };
            seasonMap[key].races.push(r);
          });
          var seasonKeys = Object.keys(seasonMap).sort().reverse();
          var noSeasonCount = seasonRaces.filter(function (r) {
            return !r.seasonYear || !r.seasonQuarter;
          }).length;

          if (seasonKeys.length === 0) {
            sectionContent = div(
              { style: { textAlign: 'center', padding: '40px 20px', color: '#8b949e' } },
              div({ style: { fontSize: '36px', marginBottom: '12px' } }, '📅'),
              div({ style: { fontSize: '15px', fontWeight: '700' } }, t('no_season_data'))
            );
          } else {
            // ════════════════════════════
            // SEASON-VERGLEICH (oben)
            // ════════════════════════════
            var compRows = seasonKeys.map(function (key) {
              var s = seasonMap[key];
              var rs = s.races;
              var irT = rs.reduce(function (a, r) {
                return a + iRDelta(r);
              }, 0);
              var irS = rs.slice().sort(function (a, b) {
                return a.date.localeCompare(b.date);
              })[0];
              var irE = rs.slice().sort(function (a, b) {
                return b.date.localeCompare(a.date);
              })[0];
              var avgP =
                rs.length > 0
                  ? (
                      rs.reduce(function (a, r) {
                        return a + r.pos;
                      }, 0) / rs.length
                    ).toFixed(1)
                  : '–';
              var cleanPct =
                rs.length > 0
                  ? Math.round(
                      (rs.filter(function (r) {
                        return r.inc === 0;
                      }).length /
                        rs.length) *
                        100
                    )
                  : 0;
              var wins = rs.filter(function (r) {
                return (r.classPos || r.pos) === 1;
              }).length;
              var avgInc =
                rs.length > 0
                  ? (
                      rs.reduce(function (a, r) {
                        return a + r.inc;
                      }, 0) / rs.length
                    ).toFixed(1)
                  : '–';
              var irC = irT >= 0 ? '#3fb950' : '#f85149';
              return h(
                'tr',
                { style: { borderBottom: '1px solid #21262d44' } },
                h(
                  'td',
                  {
                    style: {
                      padding: '9px 10px',
                      color: '#58a6ff',
                      fontWeight: '900',
                      fontFamily: "'Courier New',monospace",
                      whiteSpace: 'nowrap',
                    },
                  },
                  (s.year % 100) + 'S' + s.quarter
                ),
                h(
                  'td',
                  { style: { padding: '9px 10px', color: '#8b949e', fontSize: '12px' } },
                  rs.length + ' R'
                ),
                h(
                  'td',
                  {
                    style: {
                      padding: '9px 10px',
                      color: irC,
                      fontWeight: '900',
                      fontFamily: "'Courier New',monospace",
                    },
                  },
                  fmtD(irT)
                ),
                h(
                  'td',
                  {
                    style: {
                      padding: '9px 10px',
                      color: '#c9d1d9',
                      fontFamily: "'Courier New',monospace",
                    },
                  },
                  (irS ? irS.iRatingBefore : '?') + ' → ' + (irE ? irE.iRatingAfter : '?')
                ),
                h(
                  'td',
                  { style: { padding: '9px 10px', color: '#c9d1d9', fontWeight: '700' } },
                  'Ø P' + avgP
                ),
                h(
                  'td',
                  { style: { padding: '9px 10px', color: '#3fb950' } },
                  '✓ ' + cleanPct + '%'
                ),
                h('td', { style: { padding: '9px 10px', color: '#ffd700' } }, '🥇 ' + wins),
                h('td', { style: { padding: '9px 10px', color: '#e3b341' } }, avgInc + 'x')
              );
            });

            // overlaid iR chart
            var compChartEl = null;
            if (seasonKeys.length >= 2) {
              var CW = 500,
                CH = 80,
                CP = 8;
              var allPts = seasonKeys.map(function (key) {
                var rs = seasonMap[key].races.slice().sort(function (a, b) {
                  return a.date.localeCompare(b.date);
                });
                return rs
                  .map(function (r) {
                    return r.iRatingAfter;
                  })
                  .filter(Boolean);
              });
              var allVals = [].concat.apply([], allPts);
              var cmn = Math.min.apply(null, allVals),
                cmx = Math.max.apply(null, allVals);
              var crng = Math.max(cmx - cmn, 80);
              var catCols = ['#58a6ff', '#3fb950', '#e3b341', '#f0883e'];
              var svgChildren = [];
              allPts.forEach(function (pts, si) {
                if (pts.length < 2) return;
                var xp = pts.map(function (v, i) {
                  return CP + (i / (pts.length - 1)) * (CW - 2 * CP);
                });
                var yp = pts.map(function (v) {
                  return CH - CP - ((v - cmn) / crng) * (CH - 2 * CP);
                });
                var poly = xp
                  .map(function (x, i) {
                    return x.toFixed(1) + ',' + yp[i].toFixed(1);
                  })
                  .join(' ');
                var col = catCols[si] || '#8b949e';
                svgChildren.push(
                  h('polyline', {
                    points: poly,
                    fill: 'none',
                    stroke: col,
                    strokeWidth: '1.8',
                    strokeLinejoin: 'round',
                    'stroke-dasharray': si === 0 ? 'none' : '4,3',
                  })
                );
                // last dot
                var lx = xp[xp.length - 1],
                  ly = yp[yp.length - 1];
                svgChildren.push(
                  h('circle', { cx: lx.toFixed(1), cy: ly.toFixed(1), r: '3', fill: col })
                );
              });
              compChartEl = h(
                'svg',
                {
                  width: '100%',
                  height: String(CH),
                  viewBox: '0 0 ' + CW + ' ' + CH,
                  style: { display: 'block' },
                },
                ...svgChildren
              );
            }

            var legendItems = seasonKeys.map(function (key, si) {
              var cols = ['#58a6ff', '#3fb950', '#e3b341', '#f0883e'];
              var col = cols[si] || '#8b949e';
              var s = seasonMap[key];
              return span(
                {
                  style: {
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: '5px',
                    fontSize: '11px',
                    color: col,
                    marginRight: '12px',
                  },
                },
                h('span', {
                  style: {
                    width: '16px',
                    height: '2px',
                    background: col,
                    borderRadius: '1px',
                    display: 'inline-block',
                    borderBottom: si > 0 ? '2px dashed ' + col : 'none',
                  },
                }),
                (s.year % 100) + 'S' + s.quarter
              );
            });

            var compCard = div(
              { class: 'card', style: { marginBottom: '16px' } },
              div(
                {
                  style: {
                    fontSize: '11px',
                    color: '#8b949e',
                    fontWeight: '700',
                    letterSpacing: '1px',
                    marginBottom: '12px',
                  },
                },
                '📊 SEASON-VERGLEICH'
              ),
              div(
                { style: { overflowX: 'auto', marginBottom: compChartEl ? '12px' : '0' } },
                h(
                  'table',
                  {
                    style: {
                      width: '100%',
                      borderCollapse: 'collapse',
                      fontSize: '12px',
                      fontFamily: "'Courier New',monospace",
                    },
                  },
                  h(
                    'thead',
                    {},
                    h(
                      'tr',
                      {},
                      ...[
                        'Season',
                        t('races'),
                        'iR Δ',
                        'iR Start→End',
                        'Ø Pos',
                        t('clean_short'),
                        t('wins'),
                        'Inc Ø',
                      ].map(function (col) {
                        return h(
                          'th',
                          {
                            style: {
                              textAlign: 'left',
                              padding: '7px 10px',
                              color: '#484f58',
                              fontSize: '10px',
                              letterSpacing: '1px',
                              fontWeight: '700',
                              borderBottom: '1px solid #21262d',

            // ════════════════════════════
            // SEASON-KARTEN
            // ════════════════════════════
            var seasonCards = seasonKeys.map(function (key) {
              var s = seasonMap[key];
              var rs = s.races.slice().sort(function (a, b) {
                return a.date.localeCompare(b.date);
              });
              var irTotal = rs.reduce(function (a, r) {
                return a + iRDelta(r);
              }, 0);
              var irStart = rs[0] ? rs[0].iRatingBefore : 0;
              var irEnd = rs[rs.length - 1] ? rs[rs.length - 1].iRatingAfter : 0;
              var avgPos =
                rs.length > 0
                  ? (
                      rs.reduce(function (a, r) {
                        return a + r.pos;
                      }, 0) / rs.length
                    ).toFixed(1)
                  : '–';
              var cleanN = rs.filter(function (r) {
                return r.inc === 0;
              }).length;
              var wins = rs.filter(function (r) {
                return (r.classPos || r.pos) === 1;
              }).length;
              var podiums = rs.filter(function (r) {
                return (r.classPos || r.pos) <= 3;
              }).length;
              var avgInc =
                rs.length > 0
                  ? (
                      rs.reduce(function (a, r) {
                        return a + r.inc;
                      }, 0) / rs.length
                    ).toFixed(1)
                  : '–';
              var irColor = irTotal >= 0 ? '#3fb950' : '#f85149';

              var iRPts = rs
                .map(function (r) {
                  return r.iRatingAfter;
                })
                .filter(Boolean);
              var chartEl = mkChart(iRPts, 400, 52);

              // ── week map ──
              var weekMap = {};
              rs.forEach(function (r) {
                if (r.raceWeek == null) return;
                if (!weekMap[r.raceWeek]) weekMap[r.raceWeek] = [];
                weekMap[r.raceWeek].push(r);
              });
              var weeks = Object.keys(weekMap).sort(function (a, b) {
                return +a - +b;
              });

              // pre-calc week iR for comparison
              var weekIRs = weeks.map(function (wk) {
                return weekMap[wk].reduce(function (a, r) {
                  return a + iRDelta(r);
                }, 0);
              });
              var weekAvgIR =
                weekIRs.length > 0
                  ? weekIRs.reduce(function (a, b) {
                      return a + b;
                    }, 0) / weekIRs.length
                  : 0;
              var bestWeekIR = Math.max.apply(null, weekIRs);
              var worstWeekIR = Math.min.apply(null, weekIRs);

              // ── render week rows ──
              var weekRows = weeks.map(function (wk, wi) {
                var wr = weekMap[wk].slice().sort(function (a, b) {
                  return a.date.localeCompare(b.date);

                var wIR = weekIRs[wi];
                var wClean = wr.filter(function (r) {
                  return r.inc === 0;
                }).length;
                var wColor = wIR >= 0 ? '#3fb950' : '#f85149';
                var wkKey = 'swk_' + key + '_' + wk;
                var isOpen = !!state[wkKey];

                // unique tracks
                var trackList = [];
                wr.forEach(function (r) {
                  var tn = (r.track || '').split(' - ')[0].split(' \u2013 ')[0];
                  if (trackList.indexOf(tn) === -1) trackList.push(tn);
                });
                var wTrackLabel =
                  trackList.length === 1
                    ? trackList[0]

                // week review: vs average
                var vsAvg = wIR - weekAvgIR;
                var isBest = wIR === bestWeekIR && weekIRs.length > 1;
                var isWorst = wIR === worstWeekIR && weekIRs.length > 1;
                var reviewTag = null;
                if (isBest)
                  reviewTag = span(
                    {
                      style: {
                        fontSize: '10px',
                        color: '#ffd700',
                        background: '#ffd70022',
                        border: '1px solid #ffd70033',
                        borderRadius: '4px',
                        padding: '1px 6px',
                        flexShrink: '0',
                      },
                    },
                    '🏆 beste Woche'
                  );
                else if (isWorst)
                  reviewTag = span(
                    {
                      style: {
                        fontSize: '10px',
                        color: '#f85149',
                        background: '#f8514922',
                        border: '1px solid #f8514933',
                        borderRadius: '4px',
                        padding: '1px 6px',
                        flexShrink: '0',
                      },
                    },
                    '📉 schlechteste'
                  );
                else if (vsAvg > 50)
                  reviewTag = span(
                    {
                      style: {
                        fontSize: '10px',
                        color: '#3fb950',
                        background: '#3fb95022',
                        borderRadius: '4px',
                        padding: '1px 6px',
                        flexShrink: '0',
                      },
                    },
                    '↑ +' + Math.round(vsAvg) + ' vs Ø'
                  );
                else if (vsAvg < -50)
                  reviewTag = span(
                    {
                      style: {
                        fontSize: '10px',
                        color: '#f85149',
                        background: '#f8514922',
                        borderRadius: '4px',
                        padding: '1px 6px',
                        flexShrink: '0',
                      },
                    },
                    '↓ ' + Math.round(vsAvg) + ' vs Ø'
                  );

                // ── expanded content: tracks → races ──
                var expandedContent = null;
                if (isOpen) {
                  // split by category if both present

                    return r.category === 'formula';

                    return r.category === 'road';
                  });

                  } else {

                  var catBlocks = catGroups.map(function (cg) {
                    // group by track

                    var tKeys = Object.keys(tMap);

                    var trackBlocks = tKeys.map(function (tn) {

                      var tColor = tIR >= 0 ? '#3fb950' : '#f85149';
                      var tkKey = 'stk_' + key + '_' + wk + '_' + tn.replace(/\s/g, '_');
                      var tkOpen = !!state[tkKey];

                      var raceRows = tkOpen

                                span(
                                  {

                                span(
                                  {

                      var tkHdr = div(
                        {

                      tkHdr.addEventListener('click', function () {

                      return div({}, tkHdr, raceRows);
                    });

                    return div(

                  wClean === wr.length

                    { style: { color: '#484f58', fontSize: '10px', flexShrink: '0' } },
                    isOpen ? '[-]' : '[+]'

                rowHdr.addEventListener('click', function () {
                  state[wkKey] = !isOpen;

                return div(
                  {
                    style: {

                      borderRadius: '6px',
                      marginBottom: '4px',
                      overflow: 'hidden',

                  expandedContent

              return div(
                { class: 'card', style: { marginBottom: '16px' } },
                // season header
                div(
                  {
                    style: {

                      justifyContent: 'space-between',
                      alignItems: 'center',
                      marginBottom: '10px',
                      flexWrap: 'wrap',
                      gap: '8px',
                    },
                  },
                  div(
                    { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
                    div(
                      {
                        style: {
                          background: '#161b22',
                          border: '1px solid #30363d',
                          borderRadius: '8px',
                          padding: '8px 12px',
                          textAlign: 'center',
                          flexShrink: '0',
                        },
                      },
                      div(
                        {
                          style: {
                            fontSize: '10px',
                            color: '#58a6ff',
                            fontWeight: '700',
                            letterSpacing: '1px',
                          },
                        },
                        'SEASON'
                      ),
                      div(
                        {
                          style: {
                            fontSize: '18px',
                            fontWeight: '900',
                            color: '#c9d1d9',
                            fontFamily: "'Courier New',monospace",
                          },
                        },
                        (s.year % 100) + 'S' + s.quarter
                      )
                    ),
                    div(
                      {},
                      div(
                        { style: { fontSize: '13px', color: '#8b949e' } },
                        rs.length +
                          ' ' +
                          t('races') +
                          '  Ø P' +
                          avgPos +
                          '  ' +
                          cleanN +
                          ' ' +
                          t('clean_short').replace('✓ ', '')
                      ),
                      div(
                        { style: { fontSize: '11px', color: '#484f58' } },
                        'iR: ' + (irStart || '?') + ' → ' + (irEnd || '?')
                      )
                    )
                  ),
                  div(
                    { style: { textAlign: 'right' } },
                    div(
                      {
                        style: {
                          fontSize: '26px',
                          fontWeight: '900',
                          color: irColor,
                          fontFamily: "'Courier New',monospace",
                        },
                      },
                      fmtD(irTotal)
                    ),
                    div(
                      { style: { fontSize: '10px', color: '#8b949e', letterSpacing: '1px' } },
                      'iR GESAMT'
                    )
                  )
                ),
                // iR chart
                chartEl
                  ? div(
                      {
                        style: {
                          background: '#0a0d11',
                          borderRadius: '8px',
                          padding: '8px 12px',
                          marginBottom: '10px',
                        },
                      },
                      div(
                        {
                          style: {
                            fontSize: '10px',
                            color: '#484f58',
                            letterSpacing: '1px',
                            fontWeight: '700',
                            marginBottom: '2px',
                          },
                        },
                        'iR-VERLAUF'
                      ),
                      chartEl
                    )
                  : null,
                // stats
                div(
                  { style: { display: 'flex', gap: '6px', marginBottom: '10px' } },
                  div(
                    {
                      style: {
                        flex: '1',
                        background: '#0d1117',
                        borderRadius: '8px',

                        textAlign: 'center',

                    },
                    div(
                      {
                        style: {
                          fontSize: '18px',

                          fontWeight: '900',
                          fontFamily: "'Courier New',monospace",

                      wins

                    div({ style: { fontSize: '10px', color: '#484f58' } }, t('wins'))
                  ),
                  div(

                    div(

          document.body.appendChild(el);
        }

        const activeCats = Object.keys(CATEGORIES).filter((c) =>
          races.some((r) => r.category === c)
        );
        const catData = activeCats.map((c) => {
          const latest = races
            .filter((r) => r.category === c)
            .sort((a, b) => a.date.localeCompare(b.date))
            .slice(-1)[0];
          return {
            label: catEmoji(c) + ' ' + catLabel(c).toUpperCase(),
            color: catColor(c),
            ir: (latest?.iRatingAfter ?? '–').toString(),
            sr:
              races
                .filter((r) => r.category === c && r.srAfter != null)
                .slice(-1)[0]
                ?.srAfter?.toFixed(2) ?? '–',
            cnt: races.filter((r) => r.category === c).length,
          };
        });

        const racesLabel = t('races');

        function updateSidebarTop() {
          const tabBar = document.getElementById('main-tab-bar');
          if (tabBar) {
            const rect = tabBar.getBoundingClientRect();
            el.style.top = rect.bottom + 8 + 'px';
          }
        }
        updateSidebarTop();
        if (!window._sidebarScrollBound) {
          window._sidebarScrollBound = true;
          window.addEventListener('scroll', updateSidebarTop, { passive: true });
        }

        el.innerHTML = catData
          .map(
            ({ label, color, ir, sr, cnt }) => `
    <div style="background:#0d1117;border:1px solid ${color}44;border-radius:8px;overflow:hidden;font-family:'Courier New',monospace;box-shadow:0 2px 8px #00000066;">
      <div style="padding:5px 9px;background:${color}11;border-bottom:1px solid ${color}33;">
        <span style="font-size:9px;color:${color};letter-spacing:1px;font-weight:700;">${label}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;">
        <div style="padding:6px 9px;border-right:1px solid ${color}22;border-bottom:1px solid ${color}22;">
          <div style="font-size:8px;color:#8b949e;letter-spacing:1px;margin-bottom:1px;">iR</div>
          <div style="font-size:17px;color:${color};font-weight:900;line-height:1.15;">${ir}</div>
        </div>
        <div style="padding:6px 9px;border-bottom:1px solid ${color}22;">
          <div style="font-size:8px;color:#8b949e;letter-spacing:1px;margin-bottom:1px;">SR</div>
          <div style="font-size:17px;color:${color};font-weight:900;line-height:1.15;">${sr}</div>
        </div>
        <div style="padding:5px 9px;grid-column:span 2;">
          <div style="font-size:8px;color:#8b949e;letter-spacing:1px;margin-bottom:1px;">${racesLabel}</div>
          <div style="font-size:14px;color:#c9d1d9;font-weight:700;line-height:1.15;">${cnt}</div>
        </div>
      </div>
    </div>
  `
          )
          .join('');
      }

      init();
    </script>
  </body>
</html>
