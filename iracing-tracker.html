        const existing = state.flagged.find((f) => f.iracingId === opp.iracingId);
        if (existing) openDriverForm(existing);
        else
          openDriverForm({
            name: opp.name,
            iracingId: opp.iracingId,
            tags: [],
            notes: '',
            reports: [],
          });
      }

      // ── Lap time helpers ──
      function iRLapToStr(raw) {
        if (!raw || raw === 0) return null;
        const s = raw / 10000;
        const m = Math.floor(s / 60);
        return m + ':' + (s - m * 60).toFixed(3).padStart(6, '0');
      }

      // ── JSON PARSER ──
      function parseOneJSON(jsonText) {
        const d = typeof jsonText === 'string' ? JSON.parse(jsonText) : jsonText;
        const data = d.data || d; // handle {type,data} wrapper or raw data object

        // Find RACE session
        const raceSession = (data.session_results || []).find(
          (s) => s.simsession_type_name === 'Race' || s.simsession_name === 'RACE'
        );
        if (!raceSession) throw new Error('__NO_RACE_SESSION__');

        const myCustId = loadLS('iracing-v3-my-cust-id', null);
        if (!myCustId) throw new Error('__NEED_DRIVER_SELECTION__');
        const myRow = (raceSession.results || []).find(
          (r) => String(r.cust_id) === String(myCustId)
        );
        if (!myRow) throw new Error('__NEED_DRIVER_SELECTION__');

        const startTime = data.start_time || '';
        const trackObj = data.track || {};
        const track = [trackObj.track_name, trackObj.config_name]
          .filter((v) => v && v !== 'N/A')
          .join(' - ');
        const sof = data.event_strength_of_field || 0;
        const seasonYear = data.season_year || null;
        const seasonQuarter = data.season_quarter || null;
        const raceWeek = data.race_week_num != null ? data.race_week_num : null;

        const weather = data.weather || {};
        const wetRace = weather.track_water > 0 || weather.precip_mm_final_session > 0;

        const car = myRow.car_name || '';
        const category =
          CAR_CATEGORY[car] ||
          (car.toLowerCase().includes('f4') || car.toLowerCase().includes('formula')
            ? 'formula'
            : 'road');
        const pos = (myRow.finish_position || 0) + 1; // 0-based → 1-based
        const startPos = (myRow.starting_position || 0) + 1;
        const classStartPos =
          myRow.starting_position_in_class != null ? myRow.starting_position_in_class + 1 : null;
        const inc = myRow.incidents || 0;
        const iRBefore = myRow.oldi_rating || 0;
        const iRAfter = myRow.newi_rating || 0;
        const iRDiff = iRAfter - iRBefore;
        const fl = iRLapToStr(myRow.best_lap_time);
        const avg = iRLapToStr(myRow.average_lap);
        const status = myRow.reason_out || 'Running';
        const srBefore = myRow.old_sub_level ? myRow.old_sub_level / 100 : null;
        const srAfter = myRow.new_sub_level ? myRow.new_sub_level / 100 : null;

        // Multi-class
        const myClassId = String(myRow.car_class_id || '');
        const carClass = myRow.car_class_name || null;
        const allResults = raceSession.results || [];
        const classRows = allResults
          .filter((r) => String(r.car_class_id) === myClassId)
          .sort((a, b) => a.finish_position - b.finish_position);
        const myClassIdx = classRows.findIndex((r) => String(r.cust_id) === String(myCustId));
        const classPos = myClassIdx >= 0 ? myClassIdx + 1 : null;
        const isMultiClass = classPos !== null && classPos !== pos;
        const posDisplay = isMultiClass ? 'P' + classPos + '/P' + pos : 'P' + pos;

        const id = 'r' + startTime.replace(/[^0-9]/g, '');

        return {
          preview: {
            id,
            wetRace,
            date: startTime ? startTime.slice(0, 16) : new Date().toISOString().slice(0, 16),
            track,
            car,
            category,
            sof,
            pos,
            startPos,
            inc,
            classPos: classPos || null,
            classStartPos: isMultiClass && classStartPos ? classStartPos : null,
            carClass: carClass || null,
            iRatingBefore: iRBefore,
            iRatingAfter: iRAfter,
            srBefore,
            srAfter,
            fastestLap: fl || null,
            averageLap: avg || null,
            notes:
              posDisplay +
              ' (Start P' +
              startPos +
              '), ' +
              inc +
              ' Inc, iR ' +
              iRBefore +
              '→' +
              iRAfter +
              ' (' +
              (iRDiff >= 0 ? '+' : '') +
              iRDiff +
              ')' +
              (status !== 'Running' ? ', ' + status : '') +
              '. SoF ' +
              sof +
              (wetRace ? ' 🌧️ Nasses Rennen' : '') +
              '. ',
            dnf: null,
            seasonYear,
            seasonQuarter,
            raceWeek,
          },
          allResults,
          track,
          category,
          sof,
        };
      }

      // ── Merge opponents from JSON ──
      function mergeOpponentsFromJSON(raceId, date, track, category, sof, allResults) {
        const existing = loadOpponents();
        const map = {};
        existing.forEach((d) => {
          map[d.iracingId] = d;
        });

        allResults.forEach((row) => {
          const custId = String(row.cust_id || '');
          if (!custId || custId === '0') return;
          const _myId = loadLS('iracing-v3-my-cust-id', null);
          if (_myId && custId === String(_myId)) return;
          const name = row.display_name || '';
          if (!name) return;
          const finPos = (row.finish_position || 0) + 1;
          const startPos = (row.starting_position || 0) + 1;
          const inc = row.incidents || 0;
          const iRBefore = row.oldi_rating || 0;
          const iRAfter = row.newi_rating || 0;
          const fl = iRLapToStr(row.best_lap_time);
          const status = row.reason_out || 'Running';

          if (!map[custId]) {
            map[custId] = {
              iracingId: custId,
              name,
              encounters: [],
              tags: [],
              notes: '',
              peakIR: iRBefore,
              currentIR: iRAfter,
            };
          }
          const d = map[custId];
          if (!d.encounters.find((e) => e.raceId === raceId)) {
            d.encounters.push({
              raceId,
              date,
              track,
              category,
              sof,
              pos: finPos,
              startPos,
              inc,
              iRBefore,
              iRAfter,
              fl,
              status,
            });
          }
          d.peakIR = Math.max(d.peakIR || 0, iRBefore, iRAfter);
          d.currentIR = iRAfter;
          if (name && name !== d.name) d.name = name;
        });

        const merged = Object.values(map);
        saveOpponents(merged);
        return merged.length;
      }

      // ── Batch JSON import ──
      function handleJSONBatch(files) {
        let done = 0,
          srPatched = 0,
          seasonPatched = 0,
          newRaces = 0,
          skipped = 0,
          errors = [];
        const current = loadLS(DB_KEY, SEED_RACES);
        let races = [...current];

        const processNext = (idx) => {
          if (idx >= files.length) {
            updateRaces(races);
            setState({
              modal: {
                type: 'batchSummary',
                newRaces,
                srPatched,
                seasonPatched,
                skipped,
                errors,
                fileCount: files.length,
              },
            });
            return;
          }
          const file = files[idx];
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const { preview, allResults, track, category, sof } = parseOneJSON(ev.target.result);
              const existing = races.find((r) => r.id === preview.id);
              if (existing) {
                let patch = {};
                if (existing.srAfter === null && preview.srAfter !== null) {
                  patch = { ...patch, srBefore: preview.srBefore, srAfter: preview.srAfter };
                  srPatched++;
                }
                if (existing.seasonYear == null && preview.seasonYear != null) {
                  patch = {
                    ...patch,
                    seasonYear: preview.seasonYear,
                    seasonQuarter: preview.seasonQuarter,
                    raceWeek: preview.raceWeek,
                  };
                  seasonPatched++;
                }
                if (Object.keys(patch).length > 0) {
                  races = races.map((r) => (r.id === preview.id ? { ...r, ...patch } : r));
                } else {
                  skipped++;
                }
                mergeOpponentsFromJSON(preview.id, preview.date, track, category, sof, allResults);
              } else {
                races = [...races, { ...preview }];
                mergeOpponentsFromJSON(preview.id, preview.date, track, category, sof, allResults);
                newRaces++;
              }
            } catch (err) {
              errors.push(file.name + ': ' + err.message);
            }
            processNext(idx + 1);
          };
          reader.readAsText(file);
        };
        processNext(0);
      }

      // ── Single JSON handler ──
      function handleJSON(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        e.target.value = '';

      // ── API FETCH ──

      function inferCategoryFromApiRace(raw) {
        const catId = raw.track_category_id || raw.license_category_id || raw.category_id || 0;
        const sn = (raw.series_name || '').toLowerCase();
        const cn = (raw.car_name || '').toLowerCase();
        const formulaKw = ['formula', ' f1', ' f2', ' f3', 'ir-04', 'usf', 'indy', 'f4'];
        if (catId === 1) return 'oval';
        if (catId === 3) return 'dirt_oval';
        if (catId === 4) return 'dirt_road';
        if (catId === 2) {
          return formulaKw.some((k) => sn.includes(k) || cn.includes(k)) ? 'formula' : 'road';
        }
        return (
          CAR_CATEGORY[raw.car_name] || (formulaKw.some((k) => cn.includes(k)) ? 'formula' : 'road')
        );
      }

      function transformApiRace(raw) {
        const sessionTime = raw.session_start_time || raw.start_time || '';
        const id = 'r' + sessionTime.replace(/[^0-9]/g, '');

        const trackName = raw.track_name || (raw.track && raw.track.track_name) || 'Unknown Track';
        const configName = raw.config_name || (raw.track && raw.track.config_name);
        const track =
          configName && configName !== 'N/A' ? trackName + ' - ' + configName : trackName;

        const pos = (raw.finish_position != null ? raw.finish_position : -1) + 1;
        const startPos =
          (raw.start_position != null
            ? raw.start_position
            : raw.starting_position != null
              ? raw.starting_position
              : -1) + 1;
        const finishInClass = raw.finish_position_in_class;
        const startInClass = raw.starting_position_in_class;
        const classPos = finishInClass != null ? finishInClass + 1 : null;
        const classStartPos = startInClass != null ? startInClass + 1 : null;
        const isMultiClass = classPos !== null && classPos !== pos;

        const iRBefore = raw.oldi_rating || raw.old_irating || 0;
        const iRAfter = raw.newi_rating || raw.new_irating || 0;
        const iRDiff = iRAfter - iRBefore;
        const srBefore = raw.old_sub_level ? raw.old_sub_level / 100 : null;
        const srAfter = raw.new_sub_level ? raw.new_sub_level / 100 : null;
        const sof = raw.strength_of_field || raw.event_strength_of_field || 0;
        const inc = raw.incidents || 0;
        const car = raw.car_name || '';
        const carClass = raw.car_class_name || null;
        const category = inferCategoryFromApiRace(raw);
        const fastestLap = iRLapToStr(raw.best_lap_time);
        const averageLap = iRLapToStr(raw.average_lap);
        const seasonYear = raw.season_year || null;
        const seasonQuarter = raw.season_quarter || null;
        const raceWeek = raw.race_week_num != null ? raw.race_week_num : null;
        const posDisplay = isMultiClass ? 'P' + classPos + '/P' + pos : 'P' + pos;
        const reasonOut = raw.reason_out || 'Running';
        const notes =
          posDisplay +
          ' (Start P' +
          startPos +
          '), ' +
          inc +
          ' Inc, iR ' +
          iRBefore +
          '→' +
          iRAfter +
          ' (' +
          (iRDiff >= 0 ? '+' : '') +
          iRDiff +
          ')' +
          (reasonOut !== 'Running' ? ', ' + reasonOut : '') +
          '. SoF ' +
          sof +
          '. ';

        return {
          id,
          date: sessionTime.slice(0, 16),
          track,
          car,
          category,
          sof,
          pos,
          startPos,
          classPos: isMultiClass ? classPos : null,
          classStartPos: isMultiClass && classStartPos ? classStartPos : null,
          carClass,
          inc,
          iRatingBefore: iRBefore,
          iRatingAfter: iRAfter,
          srBefore,
          srAfter,
          fastestLap: fastestLap || null,
          averageLap: averageLap || null,
          seasonYear,
          seasonQuarter,
          raceWeek,
          wetRace: raw.wetRace != null ? !!raw.wetRace : false,
          dnf: null,
          notes,
        };
      }

      function openApiImport() {
        const savedCustId = loadLS('iracing-v3-my-cust-id', null);
        const savedDays = loadLS('iracing-v3-api-days', 84);
        const savedBase = loadLS('iracing-v3-api-base', 'http://localhost:3000');
        setState({
          modal: {
            type: 'apiImport',
            custId: savedCustId || '',
            days: savedDays,
            baseUrl: savedBase,
            loading: false,
            error: null,
          },
        });
      }

      async function fetchRacesFromAPI() {
        const modal = state.modal;
        if (!modal || modal.type !== 'apiImport') return;

        const custId = String(modal.custId || '').trim();
        const days = parseInt(modal.days, 10) || 84;
        const baseUrl = (modal.baseUrl || 'http://localhost:3000').replace(/\/$/, '');

        if (!custId || isNaN(Number(custId))) {
          setState({
            modal: { ...state.modal, error: 'Please enter a valid numeric Customer ID.' },
          });
          return;
        }

        saveLS('iracing-v3-my-cust-id', custId);
        saveLS('iracing-v3-api-days', days);
        saveLS('iracing-v3-api-base', baseUrl);

        const setProgress = (msg) =>
          setState({ modal: { ...state.modal, loading: true, error: null, progress: msg } });

        setProgress(t('api_fetch_loading'));

        try {
          // ── Step 1: Fetch the race list ──────────────────────────────────
          const endDate = new Date();
          const startDate = new Date(endDate.getTime() - days * 86400000);
          const listUrl =
            baseUrl +
            '/api/driver/' +
            custId +
            '/season-races?start_date=' +
            encodeURIComponent(startDate.toISOString()) +
            '&end_date=' +
            encodeURIComponent(endDate.toISOString());

          const listResp = await fetch(listUrl);
          if (!listResp.ok) {
            const body = await listResp.json().catch(() => ({}));
            throw new Error(body.error || 'HTTP ' + listResp.status);
          }

          const { races: rawRaces } = await listResp.json();
          const incoming = rawRaces || [];

          if (incoming.length === 0) {
            setState({
              modal: { type: 'apiFetchSummary', added: 0, updated: 0, skipped: 0, days, total: 0 },
            });
            return;
          }

          // ── Step 2: Fetch subsession details for iRating + opponents ─────
          // search_series doesn't include oldi_rating/newi_rating — those
          // only come from the full subsession result (same as the JSON files).
          const enriched = incoming.map((r) => ({ ...r })); // shallow copy

          const CONCURRENCY = 3;
          for (let i = 0; i < incoming.length; i += CONCURRENCY) {
            const end = Math.min(i + CONCURRENCY, incoming.length);
            setProgress(
              (state.lang === 'de' ? 'Details ' : 'Details ') +
                (i + 1) +
                '–' +
                end +
                ' / ' +
                incoming.length +
                '…'
            );

            await Promise.all(
              incoming.slice(i, i + CONCURRENCY).map(async (raw, batchIdx) => {
                const globalIdx = i + batchIdx;
                const subsessionId = raw.subsession_id;
                if (!subsessionId) return;

                try {
                  const subResp = await fetch(baseUrl + '/api/subsession/' + subsessionId);
                  if (!subResp.ok) return;

                  const subData = await subResp.json();

                  // Find the race session in the subsession result
                  const raceSession = (subData.session_results || []).find(
                    (s) => s.simsession_type_name === 'Race' || s.simsession_name === 'RACE'
                  );
                  if (!raceSession) return;

                  const allDriverRows = raceSession.results || [];

                  // Find this driver's row to get iRating + SR
                  const myRow = allDriverRows.find((r) => String(r.cust_id) === String(custId));

                  if (myRow) {
                    // Overwrite iRating / SR / lap fields with authoritative subsession values
                    enriched[globalIdx] = {
                      ...enriched[globalIdx],
                      oldi_rating: myRow.oldi_rating || myRow.old_irating || 0,
                      newi_rating: myRow.newi_rating || myRow.new_irating || 0,
                      old_sub_level: myRow.old_sub_level || 0,
                      new_sub_level: myRow.new_sub_level || 0,
                      best_lap_time: myRow.best_lap_time || raw.best_lap_time,
                      average_lap: myRow.average_lap || raw.average_lap,
                      reason_out: myRow.reason_out || raw.reason_out,
                      // Weather from top-level subsession data
                      wetRace:
                        (subData.weather && subData.weather.track_water > 0) ||
                        (subData.weather && subData.weather.precip_mm_final_session > 0) ||
                        false,
                    };
                  }

                  // Build opponent records from the full driver grid
                  // (mergeOpponentsFromJSON is synchronous — safe inside Promise.all)
                  const raceForOpponents = transformApiRace(enriched[globalIdx]);
                  mergeOpponentsFromJSON(
                    raceForOpponents.id,
                    raceForOpponents.date,
                    raceForOpponents.track,
                    raceForOpponents.category,
                    raceForOpponents.sof,
                    allDriverRows
                  );
                } catch (_e) {
                  // Skip this subsession on any error — we'll still import the race
                }
              })
            );
          }

          // ── Step 3: Merge enriched races into the store ──────────────────
          const existing = [...state.races];
          let added = 0,
            updated = 0,
            skipped = 0;

          enriched.forEach((raw) => {
            const race = transformApiRace(raw);
            const dup = existing.find((r) => r.id === race.id);
            if (dup) {
              let patch = {};
              if ((!dup.iRatingAfter || dup.iRatingAfter === 0) && race.iRatingAfter)
                patch = {
                  ...patch,
                  iRatingBefore: race.iRatingBefore,
                  iRatingAfter: race.iRatingAfter,
                };
              if (!dup.srAfter && race.srAfter)
                patch = { ...patch, srBefore: race.srBefore, srAfter: race.srAfter };
              if (!dup.seasonYear && race.seasonYear)
                patch = {
                  ...patch,
                  seasonYear: race.seasonYear,
                  seasonQuarter: race.seasonQuarter,
                  raceWeek: race.raceWeek,
                };
              if (!dup.fastestLap && race.fastestLap)
                patch = { ...patch, fastestLap: race.fastestLap, averageLap: race.averageLap };
              if (!dup.wetRace && race.wetRace) patch = { ...patch, wetRace: race.wetRace };
              if (Object.keys(patch).length) {
                existing[existing.indexOf(dup)] = { ...dup, ...patch };
                updated++;
              } else {
                skipped++;
              }
            } else {
              existing.push(race);
              added++;
            }
          });

          updateRaces(existing);
          setState({
            modal: {
              type: 'apiFetchSummary',
              added,
              updated,
              skipped,
              days,
              total: incoming.length,
            },
          });
        } catch (err) {
          setState({
            modal: { ...state.modal, loading: false, error: err.message || String(err) },
          });
        }
      }

          case 'driverSelect':

          case 'csvPreview':

            return renderJSONDuplicateModal(modal.preview, modal.allResults);

      function buildImportHighlights(preview) {
        const existing = state.races;
        const delta = preview.iRatingAfter - preview.iRatingBefore;
        const catRaces = existing.filter((r) => r.category === preview.category);
        const trackRaces = existing.filter((r) => r.track === preview.track);
        const carRaces = existing.filter((r) => r.car === preview.car);
        const avgInc =
          existing.length > 0 ? existing.reduce((s, r) => s + r.inc, 0) / existing.length : 3;
        const recentCat = catRaces.slice(-20);
        const avgDelta =
          recentCat.length >= 5
            ? recentCat.reduce((s, r) => s + iRDelta(r), 0) / recentCat.length
            : null;
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const effectivePos = preview.classPos || preview.pos;
        let lossSeries = 0,
          winSeries = 0;
        for (let i = catRaces.length - 1; i >= 0; i--) {
          const d = iRDelta(catRaces[i]);
          if (d < 0) {
            if (winSeries === 0) lossSeries++;
            else break;
          } else {
            if (lossSeries === 0) winSeries++;
            else break;
          }
        }
        const lastTrackRace = trackRaces.length > 0 ? trackRaces[trackRaces.length - 1] : null;
        const trackDeltas = trackRaces.map((r) => iRDelta(r));
        const trackKarma =
          trackDeltas.length >= 3
            ? trackDeltas.reduce((s, v) => s + v, 0) / trackDeltas.length
            : null;
        const h = [];

        if (effectivePos === 1) {
          const pool = [
            'WIN! ' + preview.iRatingAfter + ' iR.',
            'P1. No contest.',
            'Won. Just like that.',
            'First across the line — ' + fmtD(delta) + ' iR.',
          ];
          if (lossSeries >= 3) pool.push('After ' + lossSeries + ' losses: WIN. Long overdue.');
          h.push({ icon: '🏆', text: pick(pool), color: '#ffd700' });
        } else if (delta >= 200) {
          h.push({
            icon: '💰',
            text: pick([
              fmtD(delta) + ' iR — massive haul.',
              fmtD(delta) + " iR. That's how it's done.",
              fmtD(delta) + ' iR in one shot.',
            ]),
            color: '#3fb950',
          });
        } else if (delta >= 80) {
          h.push({
            icon: '📈',
            text: pick([
              fmtD(delta) + ' iR — solid.',
              fmtD(delta) + ' iR. Consistent.',
              fmtD(delta) + ' iR — curve going up.',
            ]),
            color: '#3fb950',
          });
        } else if (delta > 0) {
          h.push({
            icon: '✅',
            text: pick([
              fmtD(delta) + " iR — at least it's green.",
              fmtD(delta) + ' iR. Take it.',
              fmtD(delta) + ' iR — not spectacular but positive.',
            ]),
            color: '#3fb950',
          });
        } else if (delta === 0) {
          h.push({
            icon: '😐',
            text: pick([
              "±0 iR — as if you weren't there.",
              'Exactly zero. Coffee break would have been just as effective.',
              '±0 iR. The universe is indifferent.',
            ]),
            color: '#8b949e',
          });
        } else if (delta >= -50) {
          h.push({
            icon: '😤',
            text: pick([
              delta + ' iR — close but not enough.',
              delta + ' iR lost. Marginal, but still red.',
              delta + ' iR. Move on.',
            ]),
            color: '#e3b341',
          });
        } else {
          const pool = [
            delta + ' iR — that hurt.',
            delta + ' iR gone. Ouch.',
            delta + ' iR. Tough one.',
          ];
          if (lossSeries >= 3)
            pool.push(delta + ' iR — ' + lossSeries + ' losses in a row. Maybe take a break?');
          h.push({ icon: '📉', text: pick(pool), color: '#f85149' });
        }

        if (avgDelta !== null) {
          const avgStr = fmtD(Math.round(avgDelta));
          if (delta > avgDelta + 60)
            h.push({
              icon: '🔥',
              text: pick([
                'Above your recent average (avg ' + avgStr + ' iR). Form is up.',
                'Clearly above your avg — ' + avgStr + ' iR typical.',
              ]),
              color: '#3fb950',
            });
          else if (delta < avgDelta - 60)
            h.push({
              icon: '❄️',
              text: pick([
                'Below your current avg (avg ' + avgStr + ' iR). Form dip?',
                'Worse than your avg — normally ' + avgStr + ' iR.',
              ]),
              color: '#e3b341',
            });
        }

        for (const m of [1000, 1500, 2000, 2500, 3000, 3500, 4000]) {
          if (preview.iRatingBefore < m && preview.iRatingAfter >= m) {
            const everReached = existing.some((r) => r.iRatingAfter >= m);
            h.push({
              icon: '🎉',
              text: everReached
                ? 'Back above ' + m + ' iR — welcome back.'
                : m + ' iR milestone reached!',
              color: '#ffd700',
            });
            break;
          }
        }

        if (preview.inc === 0) {
          const streak = (() => {
            let s = 0;
            for (let i = existing.length - 1; i >= 0; i--) {
              if (existing[i].inc === 0) s++;
              else break;
            }
            return s;
          })();
          h.push({
            icon: streak >= 4 ? '🧼' : '✓',
            text:
              streak >= 4
                ? `${streak + 1} clean races in a row.`
                : pick([
                    'Clean. No stress.',
                    "0x incidents. That's the way.",
                    'No damage, no drama.',
                  ]),
            color: streak >= 4 ? '#58a6ff' : '#3fb950',
          });
        } else if (preview.inc >= 6) {
          h.push({
            icon: '⚠️',
            text: preview.externalInc
              ? preview.inc + 'x incidents — not your fault.'
              : preview.inc + 'x incidents. Rough one.',
            color: preview.inc >= 10 ? '#f85149' : '#e3b341',
          });
        }

        if (trackRaces.length === 0) {
          h.push({
            icon: '🗺️',
            text: pick([
              'First race at ' + preview.track + '.',
              'New track: ' + preview.track + '.',
              'Debut at ' + preview.track + '.',
            ]),
            color: '#a371f7',
          });
        } else {
          const bestPos = Math.min(...trackRaces.map((r) => r.classPos || r.pos));
          if (effectivePos < bestPos)
            h.push({
              icon: '🎯',
              text: 'New best result here: P' + effectivePos + ' (was P' + bestPos + ').',
              color: '#ffd700',
            });
        }

        return h.slice(0, 4);
      }

      // ── MAIN RENDER ──
      // ── ZEITANALYSE TAB ──
      function renderZeitanalyse() {
        const races = state.races;
        if (!races || races.length === 0)
          return div(
            { class: 'card', style: { textAlign: 'center', color: '#8b949e', padding: '40px' } },
            t('no_races_zeit')
          );

        function isWeekend(dateStr) {
          const d = new Date(dateStr);
          const day = d.getDay(); // 0=So, 6=Sa
          return day === 0 || day === 6;
        }

        function stats(arr) {
          if (!arr || arr.length === 0)
            return {
              count: 0,
              avgPos: null,
              avgInc: null,
              irGain: null,
              top5: 0,
              cleanRate: 0,
              cleanCount: 0,
            };
          const count = arr.length;
          const avgPos = (arr.reduce((s, r) => s + r.pos, 0) / count).toFixed(1);
          const avgInc = (arr.reduce((s, r) => s + (r.inc || 0), 0) / count).toFixed(1);
          const irGain = arr.reduce(
            (s, r) => s + ((r.iRatingAfter || 0) - (r.iRatingBefore || 0)),
            0
          );
          const top5 = arr.filter((r) => r.pos <= 5).length;
          const cleanCount = arr.filter((r) => r.inc === 0).length;
          const cleanRate = Math.round((cleanCount / count) * 100);
          return { count, avgPos, avgInc, irGain, top5, cleanCount, cleanRate };
        }

        const wd = races.filter((r) => !isWeekend(r.date));
        const we = races.filter((r) => isWeekend(r.date));
        const wdS = stats(wd);
        const weS = stats(we);

        // Color helpers
        function posColor(v, other) {
          if (!v || !other) return '#c9d1d9';
          return parseFloat(v) < parseFloat(other) ? '#3fb950' : '#f85149';
        }
        function incColor(v, other) {
          if (!v || !other) return '#c9d1d9';
          return parseFloat(v) < parseFloat(other) ? '#3fb950' : '#f85149';
        }
        function irColor(v) {
          return v >= 0 ? '#3fb950' : '#f85149';
        }

        // Verdict
        let verdictText = '';
        let verdictColor = '#c9d1d9';
        if (wdS.count > 0 && weS.count > 0) {
          const pdiff = parseFloat(weS.avgPos) - parseFloat(wdS.avgPos);
          const idiff = parseFloat(weS.avgInc) - parseFloat(wdS.avgInc);
          if (pdiff > 1.5 && idiff > 0.5) {
            verdictText = t('verdict_alcohol');
            verdictColor = '#f85149';
          } else if (pdiff < -1.5 && idiff < -0.5) {
            verdictText = t('verdict_work');
            verdictColor = '#f85149';
          } else if (Math.abs(pdiff) < 0.5 && Math.abs(idiff) < 0.3) {
            verdictText = t('verdict_tie');
            verdictColor = '#e3b341';
          } else if (pdiff > 0) {
            verdictText = t('verdict_we_worse');
            verdictColor = '#e3b341';
          } else {
            verdictText = t('verdict_we_better');
            verdictColor = '#3fb950';
          }
        }

        // Bar chart helper — CSS divs (avoids SVG namespace issues)
        function barChart(wdVal, weVal, label, format, lowerBetter) {
          const v0 = parseFloat(wdVal || 0),
            v1 = parseFloat(weVal || 0);
          const maxV = Math.max(v0, v1, 0.1);
          const colors = lowerBetter
            ? [v0 <= v1 ? '#3fb950' : '#f85149', v1 <= v0 ? '#3fb950' : '#f85149']
            : [v0 >= v1 ? '#3fb950' : '#f85149', v1 >= v0 ? '#3fb950' : '#f85149'];
          const bar = (val, col) =>
            div(
              {
                style: {
                  flex: '1',
                  display: 'flex',
                  flexDirection: 'column',
                  alignItems: 'center',
                  gap: '4px',
                  marginTop: '8px',
                },
              },
              div(
                {
                  style: {
                    width: '100%',
                    height: '40px',
                    display: 'flex',
                    alignItems: 'flex-end',
                    justifyContent: 'center',
                  },
                },
                div({
                  style: {
                    width: '60%',
                    height: Math.max(3, (val / maxV) * 36) + 'px',
                    background: col + '44',
                    borderRadius: '3px 3px 0 0',
                    borderTop: '3px solid ' + col,
                  },
                })
              )
            );
          return div(
            { style: { display: 'flex', gap: '8px' } },
            bar(v0, colors[0]),
            bar(v1, colors[1])
          );
        }

        // iR bars with negative support
        function irBarChart(wdVal, weVal) {
          const v0 = wdVal || 0,
            v1 = weVal || 0;
          const absMax = Math.max(Math.abs(v0), Math.abs(v1), 1);
          const colors = [v0 >= 0 ? '#3fb950' : '#f85149', v1 >= 0 ? '#3fb950' : '#f85149'];
          const bar = (val, col) => {
            const pct = (Math.abs(val) / absMax) * 36;
            return div(
              {

                  flex: '1',
                  display: 'flex',

                        top: '50%',
                      },
                    })

            );
          };
          return div(
            { style: { display: 'flex', gap: '8px' } },
            bar(v0, colors[0]),
            bar(v1, colors[1])
          );
        }

        // Wochentag breakdown (Mo-So)
        const dayNames =
          state.lang === 'de'
            ? ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa']
            : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dayData = Array.from({ length: 7 }, (_, i) => {
          const dr = races.filter((r) => new Date(r.date).getDay() === i);
          return { day: dayNames[i], s: stats(dr), isWE: i === 0 || i === 6 };
        });

        // Hour distribution
        function getHour(dateStr) {
          if (!dateStr.includes('T')) return null;
          const t = dateStr.split('T')[1];
          if (!t) return null;
          return parseInt(t.split(':')[0]);
        }
        const hourBuckets = {};
        races.forEach((r) => {
          const h = getHour(r.date);
          if (h === null) return;
          if (!hourBuckets[h]) hourBuckets[h] = { count: 0, posSum: 0, incSum: 0, irSum: 0 };
          hourBuckets[h].count++;
          hourBuckets[h].posSum += r.pos;
          hourBuckets[h].incSum += r.inc || 0;
          hourBuckets[h].irSum += (r.iRatingAfter || 0) - (r.iRatingBefore || 0);
        });
        const hours = Object.keys(hourBuckets)
          .map(Number)
          .sort((a, b) => a - b);

        function kpiCard(label, wdVal, weVal, unit, lowerBetter) {

          // Verdict banner

                    border: '1px solid #30363d',
                    borderRadius: '10px',

                  },

          // Head-to-Head KPI Grid

                  ),

      // ── STATISTIKEN TAB ──
      function renderStatistiken() {
        const { races } = state;
        if (!state.statCat) state.statCat = 'all';

        const cat = state.statCat;
        const section = state.statSection;

        const filtRaces = cat === 'all' ? races : races.filter((r) => r.category === cat);
        const sortedRaces = [...filtRaces].sort((a, b) => a.date.localeCompare(b.date));

        // ── helpers ──
        const fmtLap = (s) => s || '–';
        const lapToSec = (s) => {
          if (!s) return null;
          const p = s.split(':');
          if (p.length === 2) return parseFloat(p[0]) * 60 + parseFloat(p[1]);
          return parseFloat(s);
        };

        // ── Category filter buttons ──
        const catBtns = div(
          { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } },
          ...[
            ['all', '⬜ ' + t('all'), '#c9d1d9'],
            ...Object.keys(CATEGORIES)
              .filter((c) => races.some((r) => r.category === c))
              .map((c) => [c, catEmoji(c) + ' ' + catLabel(c), catColor(c)]),
          ].map(([v, l, c]) =>
            btn(
              {
                class: 'btn-outline',

                  color: cat === v ? c : '#8b949e',

        // ── Section nav ──

        // ════════════════════════════════

        if (section === 'strecken') {
          if (!state.statSort) state.statSort = 'irSum';
          const ss = state.statSort;
          const normTrack = (t) =>
            (t || '')
              .trim()

              .replace('Summit Point Raceway', 'Summit Point');
          const normCar = (c) =>
            (c || '')
              .trim()
              .replace('Global Mazda MX-5 Cup', 'MX-5')

          filtRaces.forEach((r) => {
            const key = normTrack(r.track) + (r.car ? '|' + normCar(r.car) : '');

                track: normTrack(r.track),
                car: normCar(r.car),
                count: 0,
                posSum: 0,
                best: 99,
                irSum: 0,
                incSum: 0,
                clean: 0,
                laps: [],
              };
            const t = trackMap[key];
            t.count++;
            t.posSum += r.pos;
            t.best = Math.min(t.best, r.pos);
            t.irSum += (r.iRatingAfter || 0) - (r.iRatingBefore || 0);
            t.incSum += r.inc;

                            color: '#c9d1d9',
                            fontWeight: '700',
                            maxWidth: '220px',
                            overflow: 'hidden',
                            textOverflow: 'ellipsis',
                            whiteSpace: 'nowrap',
                          },
                        },
                        shortTrack(t.track)
                      ),
                      h(
                        'td',
                        {
                          style: {
                            padding: '10px 12px',
                            color: '#8b949e',
                            fontSize: '12px',
                            whiteSpace: 'nowrap',
                          },
                        },
                        shortCar(t.car)
                      ),
                      h(
                        'td',
                        { style: { padding: '10px 12px', color: '#c9d1d9', fontWeight: '700' } },
                        t.count
                      ),
                      h(
                        'td',
                        {
                          style: {
                            padding: '10px 12px',
                            color:
                              parseFloat(avgP) <= 8
                                ? '#3fb950'
                                : parseFloat(avgP) <= 14
                                  ? '#e3b341'
                                  : '#f85149',
                            fontWeight: '700',
                          },
                        },
                        avgP
                      ),
                      h(
                        'td',
                        { style: { padding: '10px 12px', color: '#ffd700', fontWeight: '700' } },
                        'P' + t.best
                      ),
                      h(
                        'td',
                        { style: { padding: '10px 12px', color: incC, fontWeight: '700' } },
                        avgI + 'x'
                      ),
                      h(
                        'td',
                        { style: { padding: '10px 12px', color: '#3fb950' } },
                        cleanPct + '%'
                      ),
                      h(
                        'td',
                        {
                          style: {
                            padding: '10px 12px',
                            color: irC,
                            fontWeight: '700',
                            fontFamily: 'monospace',
                          },
                        },
                        fmtD(t.irSum)
                      )
                    );
                  })
                )
              )
            )
          );
        }

        // ════════════════════════════════
        // 2. INCIDENT-ANALYSE
        // ════════════════════════════════
        else if (section === 'incidents') {
          const formulaR = [...races.filter((r) => r.category === 'formula')].sort((a, b) =>
            a.date.localeCompare(b.date)
          );
          const roadR = [...races.filter((r) => r.category === 'road')].sort((a, b) =>
            a.date.localeCompare(b.date)
          );
          const calcAvgInc = (arr) =>
            arr.length ? (arr.reduce((s, r) => s + r.inc, 0) / arr.length).toFixed(2) : '–';
          const calcClean = (arr) =>
            arr.length
              ? Math.round((arr.filter((r) => r.inc === 0).length / arr.length) * 100) + '%'
              : '–';

          // Rolling 5-race average over time for both cats
          const buildRolling = (arr, n = 5) => {
            return arr.map((_, i) => {
              const slice = arr.slice(Math.max(0, i - n + 1), i + 1);
              return {
                x: i + 1,
                avg: parseFloat((slice.reduce((s, r) => s + r.inc, 0) / slice.length).toFixed(2)),
                date: arr[i].date,
                inc: arr[i].inc,
              };
            });
          };
          const fRolling = buildRolling(formulaR);
          const rRolling = buildRolling(roadR);

          // Incidents per range bucket
          const incBuckets = (arr) => {
            const b = {};
            arr.forEach((r) => {
              const k = Math.min(r.inc, 8);
              b[k] = (b[k] || 0) + 1;
            });
            return Array.from({ length: 9 }, (_, i) => ({
              pos: i === 8 ? '8+' : i,
              count: b[i] || 0,
            }));
          };
          const fBuckets = incBuckets(formulaR);
          const rBuckets = incBuckets(roadR);

          // Monthly trend
          const monthlyInc = (arr) => {
            const m = {};
            arr.forEach((r) => {
              const mo = r.date.slice(0, 7);
              if (!m[mo]) {
                m[mo] = { sum: 0, count: 0 };
              }
              m[mo].sum += r.inc;
              m[mo].count++;
            });
            return Object.keys(m)
              .sort()
              .map((k) => ({
                month: k.slice(5),
                avg: (m[k].sum / m[k].count).toFixed(2),
                count: m[k].count,
              }));
          };
          const allMonthly = monthlyInc(sortedRaces);

          const miniBar = (buckets, color) => {
            const max = Math.max(...buckets.map((b) => b.count)) || 1;
            return div(
              {
                style: {
                  display: 'flex',
                  gap: '4px',
                  alignItems: 'flex-end',
                  height: '60px',
                  marginTop: '8px',
                },
              },
              ...buckets.map((b) => {
                const pct = b.count / max;
                const c = b.pos === 0 ? '#3fb950' : parseInt(b.pos) <= 2 ? '#e3b341' : '#f85149';
                return div(
                  {
                    style: {
                      flex: '1',
                      display: 'flex',
                      flexDirection: 'column',
                      alignItems: 'center',
                      gap: '2px',
                    },
                  },
                  div({
                    style: {
                      width: '100%',
                      background: c + '44',
                      borderRadius: '2px 2px 0 0',
                      height: Math.max(2, pct * 48) + 'px',
                      border: '1px solid ' + c + '66',
                    },
                  }),
                  b.count > 0
                    ? div(
                        { style: { fontSize: '9px', color: c, fontFamily: 'monospace' } },
                        b.count
                      )
                    : div({ style: { height: '12px' } }),
                  div(
                    { style: { fontSize: '9px', color: '#8b949e', fontFamily: 'monospace' } },
                    b.pos + 'x'
                  )
                );
              })
            );
          };

          sectionContent = div(
            { style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
            // Summary compare
            div(
              { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' } },
              div(
                { class: 'card', style: { borderColor: '#58a6ff44' } },
                div(
                  {
                    style: {
                      fontSize: '12px',
                      color: '#58a6ff',
                      fontWeight: '700',
                      letterSpacing: '1px',
                      marginBottom: '10px',
                    },
                  },
                  '🔵 FORMULA — ' + formulaR.length + ' ' + t('races')
                ),
                div(
                  { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                  ...[
                    ['Ø Incidents', calcAvgInc(formulaR)],
                    ['0x Sauber', calcClean(formulaR)],
                  ].map(([l, v]) =>
                    div(
                      {
                        style: { background: '#161b22', borderRadius: '8px', padding: '8px 10px' },
                      },
                      div(
                        {
                          style: {
                            fontSize: '10px',
                            color: '#8b949e',
                            marginBottom: '3px',
                            letterSpacing: '1px',
                            fontWeight: '700',
                          },
                        },
                        l
                      ),
                      div(
                        {
                          style: {
                            fontSize: '18px',
                            fontWeight: '900',
                            color: '#58a6ff',
                            fontFamily: 'monospace',
                          },
                        },
                        v
                      )
                    )
                  )
                ),
                miniBar(fBuckets, '#58a6ff')
              ),
              div(
                { class: 'card', style: { borderColor: '#3fb95044' } },
                div(
                  {
                    style: {
                      fontSize: '12px',
                      color: '#3fb950',
                      fontWeight: '700',
                      letterSpacing: '1px',
                      marginBottom: '10px',
                    },
                  },
                  '🟢 ROAD — ' + roadR.length + ' ' + t('races')
                ),
                div(
                  { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
                  ...[
                    ['Ø Incidents', calcAvgInc(roadR)],
                    ['0x Sauber', calcClean(roadR)],
                  ].map(([l, v]) =>
                    div(
                      {
                        style: { background: '#161b22', borderRadius: '8px', padding: '8px 10px' },
                      },
                      div(
                        {
                          style: {
                            fontSize: '10px',
                            color: '#8b949e',
                            marginBottom: '3px',
                            letterSpacing: '1px',
                            fontWeight: '700',
                          },
                        },
                        l
                      ),
                      div(
                        {
                          style: {
                            fontSize: '18px',
                            fontWeight: '900',
                            color: '#3fb950',
                            fontFamily: 'monospace',
                          },
                        },
                        v
                      )
                    )
                  )
                ),
                miniBar(rBuckets, '#3fb950')
              )
            ),
            // Rolling avg charts
            formulaR.length > 3
              ? div(
                  { class: 'card' },
                  div(
                    {
                      style: {
                        fontSize: '14px',
                        fontWeight: '700',
                        color: '#c9d1d9',
                        marginBottom: '4px',
                      },
                    },
                    '🔵 Formula — Incidents Trend (Ø5)'
                  ),
                  svgLine(fRolling, 'avg', '#58a6ff', 600, 120)
                )
              : null,
            roadR.length > 3
              ? div(
                  { class: 'card' },
                  div(
                    {
                      style: {
                        fontSize: '14px',
                        fontWeight: '700',
                        color: '#c9d1d9',
                        marginBottom: '4px',
                      },
                    },
                    '🟢 Road — Incidents Trend (Ø5)'
                  ),
                  svgLine(rRolling, 'avg', '#3fb950', 600, 120)
                )
              : null,
            // Monthly table
            allMonthly.length > 1
              ? div(
                  { class: 'card' },
                  div(
                    {
                      style: {
                        fontSize: '14px',
                        fontWeight: '700',
                        color: '#c9d1d9',
                        marginBottom: '12px',
                      },
                    },
                    '📅 Monatlicher Ø Incidents'
                  ),
                  div(
                    { style: { overflowX: 'auto' } },
                    h(
                      'table',
                      {
                        style: {
                          width: '100%',
                          borderCollapse: 'collapse',
                          fontFamily: "'Courier New',monospace",
                          fontSize: '13px',
                        },
                      },
                      h(
                        'thead',
                        {},
                        h(
                          'tr',
                          {},
                          ...['Monat', t('races'), 'Ø Incidents', 'Bewertung'].map((col) =>
                            h(
                              'th',
                              {
                                style: {
                                  textAlign: 'left',
                                  padding: '8px 12px',
                                  color: '#8b949e',
                                  fontSize: '11px',
                                  letterSpacing: '1px',
                                  fontWeight: '700',
                                  borderBottom: '1px solid #21262d',
                                  textTransform: 'uppercase',
                                },
                              },
                              col
                            )
                          )
                        )
                      ),
                      h(
                        'tbody',
                        {},
                        ...allMonthly.map((m) => {
                          const avg = parseFloat(m.avg);
                          const c = avg <= 2 ? '#3fb950' : avg <= 4 ? '#e3b341' : '#f85149';
                          const label =
                            avg <= 2
                              ? t('clean')
                              : avg <= 4
                                ? '~ Mittel'
                                : '✗ ' + t('stat_incidents');
                          return h(
                            'tr',
                            { style: { borderBottom: '1px solid #21262d44' } },
                            h(
                              'td',
                              {
                                style: { padding: '9px 12px', color: '#c9d1d9', fontWeight: '700' },
                              },
                              m.month
                            ),
                            h('td', { style: { padding: '9px 12px', color: '#c9d1d9' } }, m.count),
                            h(
                              'td',
                              {
                                style: {
                                  padding: '9px 12px',
                                  color: c,
                                  fontWeight: '700',
                                  fontFamily: 'monospace',
                                },
                              },
                              m.avg + 'x'
                            ),
                            h(
                              'td',
                              { style: { padding: '9px 12px', color: c, fontSize: '12px' } },
                              label
                            )
                          );
                        })
                      )
                    )
                  )
                )
              : null
          );
        }

        // ════════════════════════════════
        // 3. iRATING-PROGNOSE
        // ════════════════════════════════
        else if (section === 'prognose') {
          if (state.trendWindow === undefined) state.trendWindow = 10;
          const buildPrognose = (arr, color, label) => {
            if (arr.length < 3)
              return div(
                {
                  class: 'card',
                  style: { textAlign: 'center', color: '#8b949e', padding: '30px' },
                },
                t('not_enough_data') + label
              );
            const curIR = arr[arr.length - 1].iRatingAfter;

            // Trend window: last N or all races for regression
            const totalN = arr.length;
            const ys = arr.map((r) => r.iRatingAfter);
            const tw = state.trendWindow === 'all' ? totalN : Math.min(state.trendWindow, totalN);
            const trendArr = arr.slice(-tw);
            const tOffset = totalN - tw;
            const n = trendArr.length;
            const tys = trendArr.map((r) => r.iRatingAfter);
            const sumX = tys.map((_, i) => i).reduce((a, b) => a + b, 0);
            const sumY = tys.reduce((a, b) => a + b, 0);
            const sumXY = tys.reduce((s, y, i) => s + i * y, 0);
            const sumX2 = tys.map((_, i) => i * i).reduce((a, b) => a + b, 0);
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            const trendAt = (gi) => Math.round(intercept + slope * (gi - tOffset));

            // Rolling 5-average
            const rolling = arr.map((_, i) => {
              const slice = arr.slice(Math.max(0, i - 4), i + 1);
              return {
                x: i + 1,
                iR: arr[i].iRatingAfter,
                trend: trendAt(i),
                avg5: Math.round(slice.reduce((s, r) => s + r.iRatingAfter, 0) / slice.length),
                date: arr[i].date,
              };
            });

            // Milestones
            const milestones = [1000, 1200, 1400, 1600, 1800, 2000, 2200, 2500, 3000, 4000]
              .filter((m) => m > curIR)
              .slice(0, 3);
            const racesPerPoint = slope > 0 ? slope : 0;
            const milestonesDiv =
              milestones.length > 0 && slope > 0
                ? div(
                    { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: '8px' } },
                    ...milestones.map((m) => {
                      const racesNeeded = Math.round((m - curIR) / slope);
                      return div(
                        {
                          style: {
                            background: '#161b22',
                            borderRadius: '8px',
                            padding: '8px 14px',
                            display: 'flex',
                            flexDirection: 'column',
                            gap: '2px',
                          },
                        },
                        div(
                          {
                            style: {
                              fontSize: '11px',
                              color: '#8b949e',
                              letterSpacing: '1px',
                              fontWeight: '700',
                            },
                          },
                          '🎯 ' + m + ' iR'
                        ),
                        div(
                          {
                            style: {
                              fontSize: '15px',
                              fontWeight: '900',
                              color: color,
                              fontFamily: 'monospace',
                            },
                          },
                          '~' + racesNeeded + ' ' + t('races')
                        ),
                        div(
                          { style: { fontSize: '11px', color: '#8b949e' } },
                          t('at_avg') +
                            ' +' +
                            slope.toFixed(1) +
                            ' iR/' +
                            (state.lang === 'de' ? 'Rennen' : 'Race')
                        )
                      );
                    })
                  )
                : div(
                    { style: { fontSize: '12px', color: '#f85149', marginTop: '8px' } },
                    slope <= 0 ? t('neg_trend') : ''
                  );

            // Build extended projection line (20 races ahead)
            const projCount = Math.min(20, totalN);
            const projData = [...rolling];
            for (let i = 0; i < projCount; i++) {
              projData.push({
                x: totalN + i + 1,
                iR: null,
                trend: trendAt(totalN + i),
                avg5: null,
                date: null,
              });
            }

            return div(
              { class: 'card', style: { borderColor: color + '44' } },
              div(
                {
                  style: {
                    fontSize: '14px',
                    fontWeight: '700',
                    color: '#c9d1d9',
                    marginBottom: '4px',
                  },
                },
                (color === '#58a6ff' ? '🔵 Formula' : '🟢 Road') + ' ' + t('irating_prognose')
              ),
              div(
                { style: { display: 'flex', gap: '16px', flexWrap: 'wrap', marginBottom: '12px' } },
                div(
                  {},
                  div(
                    { style: { fontSize: '11px', color: '#8b949e' } },
                    state.lang === 'de' ? 'Aktuell' : 'Current'
                  ),
                  div(
                    { class: 'mono', style: { fontSize: '22px', color } },
                    (curIR || '–').toString()
                  )
                ),
                div(
                  {},
                  div({ style: { fontSize: '11px', color: '#8b949e' } }, t('ir_trend')),
                  div(
                    {
                      class: 'mono',
                      style: { fontSize: '22px', color: slope >= 0 ? '#3fb950' : '#f85149' },
                    },
                    (slope >= 0 ? '+' : '') + slope.toFixed(1)
                  )
                ),
                div(
                  {},
                  div({ style: { fontSize: '11px', color: '#8b949e' } }, t('last10_avg')),
                  div(
                    { class: 'mono', style: { fontSize: '22px', color: color } },
                    Math.round(
                      ys.slice(-10).reduce((a, b) => a + b, 0) / Math.min(10, ys.length)
                    ).toString()
                  )
                )
              ),
              // iR chart with trend line overlay
              (() => {
                const wrapper = div({ style: { position: 'relative' } });
                // SVG chart of actual iR
                const w = 600,
                  ht = 160;
                const irVals = rolling.map((d) => d.iR);
                const trendVals = projData.map((d) => d.trend);
                const allVals = [...irVals, ...trendVals].filter((v) => v != null);
                const minV = Math.min(...allVals),
                  maxV = Math.max(...allVals);
                const range = maxV - minV || 1;
                const totalPts = projData.length;
                const px = (i) => (i / (totalPts - 1)) * w;
                const py = (v) => ht - ((v - minV) / range) * (ht - 10) - 2;
                const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svgEl.setAttribute('width', '100%');
                svgEl.setAttribute('height', ht + 20);
                svgEl.setAttribute('viewBox', '0 0 ' + w + ' ' + (ht + 20));
                svgEl.style.display = 'block';
                // Defs gradient
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                const grad = document.createElementNS(
                  'http://www.w3.org/2000/svg',
                  'linearGradient'
                );
                grad.setAttribute('id', 'pgrad' + color.slice(1));
                grad.setAttribute('x1', '0');
                grad.setAttribute('y1', '0');
                grad.setAttribute('x2', '0');
                grad.setAttribute('y2', '1');
                const s1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                s1.setAttribute('offset', '0%');
                s1.setAttribute('stop-color', color);
                s1.setAttribute('stop-opacity', '0.3');
                const s2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                s2.setAttribute('offset', '100%');
                s2.setAttribute('stop-color', color);
                s2.setAttribute('stop-opacity', '0');
                grad.appendChild(s1);
                grad.appendChild(s2);
                defs.appendChild(grad);
                svgEl.appendChild(defs);
                // Area fill for actual iR
                const areaPoints = rolling.map((d, i) => px(i) + ',' + py(d.iR)).join(' ');
                const area = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                area.setAttribute(
                  'points',
                  px(0) + ',' + ht + ' ' + areaPoints + ' ' + px(rolling.length - 1) + ',' + ht
                );
                area.setAttribute('fill', 'url(#pgrad' + color.slice(1) + ')');
                svgEl.appendChild(area);
                // Actual iR line
                const actualLine = document.createElementNS(
                  'http://www.w3.org/2000/svg',
                  'polyline'
                );
                actualLine.setAttribute(
                  'points',
                  rolling.map((d, i) => px(i) + ',' + py(d.iR)).join(' ')
                );
                actualLine.setAttribute('fill', 'none');
                actualLine.setAttribute('stroke', color);
                actualLine.setAttribute('stroke-width', '2.5');
                svgEl.appendChild(actualLine);
                // Trend line (full range, dashed for projection part)
                const trendPoints = projData.map((d, i) => px(i) + ',' + py(d.trend)).join(' ');
                const trendLine = document.createElementNS(
                  'http://www.w3.org/2000/svg',
                  'polyline'
                );
                trendLine.setAttribute('points', trendPoints);
                trendLine.setAttribute('fill', 'none');
                trendLine.setAttribute('stroke', '#e3b341');
                trendLine.setAttribute('stroke-width', '1.5');
                trendLine.setAttribute('stroke-dasharray', '5 3');
                svgEl.appendChild(trendLine);
                // Divider line between actual and projection
                const divX = px(rolling.length - 1);
                const divLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                divLine.setAttribute('x1', divX);
                divLine.setAttribute('x2', divX);
                divLine.setAttribute('y1', 0);
                divLine.setAttribute('y2', ht);
                divLine.setAttribute('stroke', '#30363d');
                divLine.setAttribute('stroke-dasharray', '3 3');
                svgEl.appendChild(divLine);
                const projLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                projLabel.setAttribute('x', parseFloat(divX) + 4);
                projLabel.setAttribute('y', 14);
                projLabel.setAttribute('fill', '#8b949e');
                projLabel.setAttribute('font-size', '10');
                projLabel.textContent = t('forecast_label');
                svgEl.appendChild(projLabel);
                wrapper.appendChild(svgEl);
                return wrapper;
              })(),
              // Legend
              div(
                {
                  style: {
                    display: 'flex',
                    gap: '16px',
                    marginTop: '6px',
                    fontSize: '11px',
                    color: '#8b949e',
                  },
                },
                span({}, span({ style: { color } }, '── '), t('actual_ir')),
                span({}, span({ style: { color: '#e3b341' } }, '- - '), t('trendline'))
              ),
              milestonesDiv
            );
          };

          const fRaces = [...races.filter((r) => r.category === 'formula')].sort((a, b) =>
            a.date.localeCompare(b.date)
          );
          const rRaces = [...races.filter((r) => r.category === 'road')].sort((a, b) =>
            a.date.localeCompare(b.date)
          );

          const twOptions = [
            ['5', state.lang === 'de' ? 'Letzte 5' : 'Last 5'],
            ['10', state.lang === 'de' ? 'Letzte 10' : 'Last 10'],
            ['20', state.lang === 'de' ? 'Letzte 20' : 'Last 20'],
            ['all', t('all_compact')],
          ];
          const trendSelector = div(
            {
              style: {
                display: 'flex',
                gap: '6px',
                alignItems: 'center',
                flexWrap: 'wrap',
                padding: '10px 14px',
                background: '#161b22',
                borderRadius: '10px',
              },
            },
            span(
              {
                style: {
                  fontSize: '11px',
                  color: '#8b949e',
                  fontWeight: '700',
                  letterSpacing: '1px',
                  marginRight: '4px',
                },
              },
              t('trend_window')
            ),
            ...twOptions.map(([v, l]) =>
              btn(
                {
                  class: 'btn-outline',
                  style: {
                    fontSize: '11px',
                    padding: '4px 10px',
                    borderRadius: '6px',
                    color: String(state.trendWindow) === v ? '#e3b341' : '#8b949e',
                    border:
                      '1px solid ' + (String(state.trendWindow) === v ? '#e3b341' : '#30363d'),
                    background: String(state.trendWindow) === v ? '#e3b34118' : 'transparent',
                  },
                  onClick: () => {
                    state.trendWindow = v === 'all' ? 'all' : parseInt(v);
                    render();
                  },
                },
                l + (String(state.trendWindow) === v ? ' ✓' : '')
              )
            )
          );

          sectionContent = div(
            { style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
            trendSelector,
            cat === 'all' || cat === 'formula' ? buildPrognose(fRaces, '#58a6ff', 'Formula') : null,
            cat === 'all' || cat === 'road' ? buildPrognose(rRaces, '#3fb950', 'Road') : null
          );
        }

        // ════════════════════════════════
        // 4. RENNBESTZEITEN
        // ════════════════════════════════
        else if (section === 'bestzeiten') {
          const bzShowWet = state.bzShowWet || false;
          const bzRaces = bzShowWet ? filtRaces : filtRaces.filter((r) => !r.wetRace);
          const normBzCar = (c) =>
            (c || '')
              .trim()
              .replace('Global Mazda MX-5 Cup', 'MX-5')
              .replace('Global MX-5 Cup', 'MX-5')
              .replace('FIA Formula 4', 'FIA F4');
          const shortCar = (c) => normBzCar(c || '');
          const catColor = (car) => (normBzCar(car).includes('F4') ? '#58a6ff' : '#3fb950');

          // Group by track → car
          const trackMap = {};
          bzRaces
            .filter((r) => r.fastestLap)
            .forEach((r) => {
              const tr = r.track;
              const car = normBzCar(r.car);
              if (!trackMap[tr]) trackMap[tr] = { track: tr, cars: {} };
              if (!trackMap[tr].cars[car]) trackMap[tr].cars[car] = { car: r.car, allLaps: [] };
              trackMap[tr].cars[car].allLaps.push({
                lap: r.fastestLap,
                date: r.date,
                pos: r.pos,
                ir: r.iRatingAfter,
                wetRace: r.wetRace,
              });
            });

          // Sort laps within each car, compute best
          Object.values(trackMap).forEach((tk) => {
            Object.values(tk.cars).forEach((c) => {
              c.allLaps.sort((a, b) => (lapToSec(a.lap) || 999) - (lapToSec(b.lap) || 999));
              c.best = c.allLaps[0];
            });
            // track best = best across all cars
            const allBests = Object.values(tk.cars)
              .map((c) => lapToSec(c.best.lap))
              .filter(Boolean);
            tk.bestSec = allBests.length ? Math.min(...allBests) : null;
            tk.carCount = Object.keys(tk.cars).length;
          });

          // Sort tracks alphabetically
          const trackRows = Object.values(trackMap).sort((a, b) => a.track.localeCompare(b.track));

          if (!state.bzTrackExp) state.bzTrackExp = {};
          if (!state.bzCarExp) state.bzCarExp = {};

          sectionContent = div(
            { style: { display: 'flex', flexDirection: 'column', gap: '6px' } },
            div(
              { style: { display: 'flex', justifyContent: 'flex-end', marginBottom: '4px' } },
              btn(
                {
                  class: 'btn-outline',
                  style: {
                    fontSize: '12px',
                    padding: '5px 12px',
                    borderRadius: '8px',
                    color: bzShowWet ? '#58a6ff' : '#8b949e',
                    border: `1px solid ${bzShowWet ? '#58a6ff' : '#30363d'}`,
                    background: bzShowWet ? '#58a6ff11' : 'transparent',
                  },
                  onClick: () => setState({ bzShowWet: !bzShowWet }),
                },
                t('wet_toggle_label') + ' ' + (bzShowWet ? t('wet_hide') : t('wet_show'))
              )
            ),
            ...trackRows.map((tk) => {
              const tExp = state.bzTrackExp[tk.track];
              const bestCarEntry = Object.values(tk.cars).find(
                (c) => lapToSec(c.best.lap) === tk.bestSec
              );
              const bestLapStr = bestCarEntry ? bestCarEntry.best.lap : null;

              // ── Car rows (rendered when track expanded) ──
              const carRows = Object.values(tk.cars)
                .sort((a, b) => (lapToSec(a.best.lap) || 999) - (lapToSec(b.best.lap) || 999))
                .map((c) => {
                  const cKey = tk.track + '|' + normBzCar(c.car);
                  const cExp = state.bzCarExp[cKey];
                  const cc = catColor(c.car);
                  const secBest = lapToSec(c.best.lap);
                  const secWorst = lapToSec(c.allLaps[c.allLaps.length - 1].lap);
                  const delta =
                    secBest && secWorst && c.allLaps.length > 1
                      ? (secWorst - secBest).toFixed(3)
                      : null;

                  return div(
                    {
                      style: {
                        background: '#0d1117',
                        borderRadius: '8px',
                        overflow: 'hidden',
                        marginBottom: '4px',
                      },
                    },
                    // Car header row
                    div(
                      {
                        style: {
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center',
                          padding: '10px 14px',
                          cursor: 'pointer',
                        },
                        onClick: () => {
                          state.bzCarExp[cKey] = !cExp;
                          render();
                        },
                      },
                      div(
                        { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
                        div(
                          {
                            style: {
                              fontSize: '11px',
                              color: cc,
                              background: cc + '18',
                              border: `1px solid ${cc}33`,
                              padding: '2px 8px',
                              borderRadius: '4px',
                              fontWeight: '700',
                            },
                          },
                          '🚗 ' + shortCar(c.car)
                        ),
                        div(
                          {
                            style: {
                              fontFamily: 'monospace',
                              fontWeight: '700',
                              color: '#e3b341',
                              fontSize: '14px',
                            },
                          },
                          c.best.lap
                        ),
                        delta
                          ? div(
                              { style: { fontSize: '11px', color: '#8b949e' } },
                              'Δ ' + delta + 's'
                            )
                          : null
                      ),
                      div(
                        { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
                        div(
                          { style: { fontSize: '11px', color: '#8b949e' } },
                          c.allLaps.length +
                            ' ' +
                            (state.lang === 'de'
                              ? 'Runde' + (c.allLaps.length !== 1 ? 'n' : '')
                              : 'lap' + (c.allLaps.length !== 1 ? 's' : ''))
                        ),
                        div(
                          {
                            style: {
                              color: '#484f58',
                              fontSize: '12px',
                              transition: 'transform .15s',
                              transform: cExp ? 'rotate(180deg)' : 'rotate(0)',
                            },
                          },
                          '▼'
                        )
                      )
                    ),
                    // Individual laps (when car expanded)
                    cExp
                      ? div(
                          {
                            style: {
                              borderTop: '1px solid #21262d',
                              padding: '8px 14px',
                              display: 'flex',
                              flexDirection: 'column',
                              gap: '3px',
                            },
                          },
                          ...c.allLaps.map((l, i) => {
                            const isB = i === 0;
                            const sec = lapToSec(l.lap);
                            const diffSec =
                              sec && secBest && !isB ? (sec - secBest).toFixed(3) : null;
                            return div(
                              {
                                style: {
                                  display: 'flex',
                                  justifyContent: 'space-between',
                                  alignItems: 'center',
                                  padding: '5px 8px',
                                  background: isB ? '#e3b34112' : 'transparent',
                                  borderRadius: '6px',
                                  fontSize: '12px',
                                },
                              },
                              div(
                                { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
                                div(
                                  {
                                    style: {
                                      width: '16px',
                                      height: '16px',
                                      borderRadius: '50%',
                                      background: isB ? '#e3b341' : '#21262d',
                                      display: 'flex',
                                      alignItems: 'center',
                                      justifyContent: 'center',
                                      fontSize: '9px',
                                      fontWeight: '700',
                                      color: isB ? '#000' : '#8b949e',
                                      flexShrink: '0',
                                    },
                                  },
                                  i + 1
                                ),
                                div(
                                  {
                                    style: {
                                      fontFamily: 'monospace',
                                      fontWeight: '700',
                                      color: isB ? '#e3b341' : '#c9d1d9',
                                      fontSize: '13px',
                                    },
                                  },
                                  l.lap
                                ),
                                diffSec
                                  ? div(
                                      {
